<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Christmas Tree | Teach With Reach Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#fdf6e3;--gold:#f5c542;--red:#d64045;--green:#2fbf71;--panel:rgba(12,28,20,.82);--line:rgba(255,255,255,.16)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0705}
body{font-family:Nunito,system-ui,sans-serif;color:var(--cream);-webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
body.mode-decorate #c{cursor:crosshair}
body.mode-remove #c{cursor:not-allowed}
button,select,input,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;min-height:44px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.on{background:var(--gold);color:#2a1d00;border-color:transparent}
.btn.danger{border-color:#d64045;color:#ffb3b5}
.hidden{display:none!important}

.topbar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:10px 14px;background:linear-gradient(rgba(0,0,0,.6),transparent);z-index:10;flex-wrap:wrap;pointer-events:none}
.topbar>*{pointer-events:auto}
h1{font-family:'Lilita One',cursive;font-weight:400;margin:0 6px;font-size:clamp(20px,2vw,30px);text-shadow:0 2px 6px rgba(0,0,0,.6)}
h1 span{color:var(--gold)}
.chip{font-weight:800;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.spacer{flex:1}

.modes{position:fixed;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px;z-index:10}
.modes .btn{width:110px;justify-content:flex-start;background:var(--panel)}
.modes .btn.on{background:var(--gold)}

.tray{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:10;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;width:min(980px,calc(100vw - 28px));backdrop-filter:blur(6px)}
.tray-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tray-lbl{font-weight:800;opacity:.75;min-width:78px}
.orn-btn{display:flex;flex-direction:column;align-items:center;gap:1px;min-width:70px;padding:4px 6px;border-radius:12px;border:2px solid transparent;background:rgba(255,255,255,.07);color:var(--cream);cursor:pointer;font-weight:800;font-size:13px}
.orn-btn .ico{font-size:22px;line-height:1}
.orn-btn.on{border-color:var(--gold);background:rgba(245,197,66,.18)}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid rgba(255,255,255,.25);cursor:pointer;padding:0}
.sw.on{border-color:#fff;box-shadow:0 0 0 3px var(--gold)}
.in{background:rgba(255,255,255,.1);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-height:44px}
.in::placeholder{color:rgba(253,246,227,.5)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:transparent;color:var(--cream);border:0;padding:9px 14px;font-weight:800;cursor:pointer;min-height:42px}
.seg button.on{background:var(--gold);color:#2a1d00}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:20;background:#0f2a1e;border-left:1px solid var(--line);padding:18px;overflow:auto;transform:translateX(100%);transition:transform .25s;-webkit-user-select:text;user-select:text}
.drawer.open{transform:none;box-shadow:-10px 0 40px rgba(0,0,0,.5)}
.drawer h2{font-family:'Lilita One',cursive;font-weight:400;margin:0;font-size:28px}
.drawer h3{font-family:'Lilita One',cursive;font-weight:400;font-size:20px;color:var(--gold);margin:20px 0 8px}
.drawer .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.opt{background:rgba(255,255,255,.08);color:var(--cream);border:2px solid transparent;border-radius:12px;padding:8px 12px;font-weight:800;cursor:pointer;min-height:42px}
.opt.on{border-color:var(--gold);background:rgba(245,197,66,.18)}
.hint{opacity:.65;font-size:14px}

.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:rgba(0,0,0,.65);border:1px solid var(--line);padding:10px 18px;border-radius:999px;font-weight:800;z-index:15;transition:opacity .6s;pointer-events:none;text-align:center;max-width:92vw}
.tip{position:fixed;z-index:30;pointer-events:none;background:#fff;color:#7a1414;font-weight:800;padding:4px 10px;border-radius:8px;box-shadow:0 3px 10px rgba(0,0,0,.4);transform:translate(-50%,-140%);white-space:nowrap}
#labels{position:fixed;inset:0;pointer-events:none;z-index:5}
.lbl{position:absolute;transform:translate(-50%,-160%);background:rgba(255,255,255,.92);color:#7a1414;font-weight:800;font-size:13px;padding:2px 8px;border-radius:6px;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.35)}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:50;background:#0b0705;font-family:'Lilita One',cursive;font-size:32px}
@media (max-width:760px){ .modes{top:auto;bottom:210px;transform:none} .modes .btn{width:auto} }
</style>
</head>
<body class="mode-decorate">
<canvas id="c" tabindex="0"></canvas>
<div id="labels"></div>
<div id="loading">🎄 Setting up the tree…</div>

<div class="topbar">
  <button class="btn hidden" id="hubBtn">🏠 Hub</button>
  <h1>🎄 Our Christmas <span>Tree</span></h1>
  <span class="chip" id="classChip"></span>
  <div class="spacer"></div>
  <span class="chip" id="countChip">0 ornaments</span>
  <button class="btn" id="spinBtn">🔄 Spin</button>
  <button class="btn" id="namesBtn">🏷 Names</button>
  <button class="btn" id="photoBtn">📷 Save picture</button>
  <button class="btn" id="drawerBtn">🎨 Tree &amp; Room</button>
  <button class="btn" id="fsBtn" title="Fullscreen">⛶</button>
</div>

<div class="modes">
  <button class="btn" data-mode="look">✋ Look</button>
  <button class="btn on" data-mode="decorate">🎄 Decorate</button>
  <button class="btn" data-mode="remove">🗑 Remove</button>
  <button class="btn" id="undoBtn">↶ Undo</button>
</div>

<div class="tray" id="tray">
  <div class="tray-row" id="ornRow"><span class="tray-lbl">Ornament</span></div>
  <div class="tray-row" id="colRow"><span class="tray-lbl">Colour</span></div>
  <div class="tray-row">
    <span class="tray-lbl">Size</span>
    <div class="seg" id="sizeSeg"><button data-s="0.9">S</button><button data-s="1.2" class="on">M</button><button data-s="1.6">L</button></div>
    <span class="tray-lbl" style="margin-left:10px">Name tag</span>
    <input class="in" id="nameIn" maxlength="18" placeholder="Optional, e.g. Maya" style="flex:1;min-width:160px">
  </div>
</div>

<div class="toast" id="toast">Drag to look around · Click the tree to hang an ornament</div>
<div class="tip hidden" id="tip"></div>

<aside class="drawer" id="drawer">
  <div class="row" style="justify-content:space-between"><h2>🎨 Tree &amp; Room</h2><button class="btn" id="closeDrawer">✕</button></div>

  <h3>✨ Lights</h3>
  <div class="row" id="lightsOn"></div>
  <div class="row" id="paletteRow"></div>
  <div class="row" id="effectRow"></div>

  <h3>⭐ Tree topper</h3>
  <div class="row" id="topperRow"></div>

  <h3>🛋 Room</h3>
  <div class="row" id="roomLightRow"></div>
  <p class="hint" style="margin:0 0 6px">Rug</p>
  <div class="row" id="rugRow"></div>
  <p class="hint" style="margin:0 0 6px">Walls</p>
  <div class="row" id="wallRow"></div>
  <div class="row" id="fireRow"></div>
  <div class="row" id="presentRow"></div>

  <h3>🧦 Stockings</h3>
  <div class="row">
    <input type="range" id="stockCount" min="0" max="8" step="1" style="flex:1">
    <b id="stockCountLbl" style="min-width:24px;text-align:right"></b>
  </div>
  <input class="in" id="stockNames" placeholder="Names, separated by commas" style="width:100%">
  <p class="hint">First names only. They show on the stocking cuffs.</p>

  <h3>🧹 Start over</h3>
  <div class="row">
    <button class="btn danger" id="clearBtn">Remove all ornaments</button>
  </div>
</aside>

<script type="module">
import * as THREE from './vendor/three-bundle.min.js';
const { OrbitControls, RoomEnvironment } = THREE;
const $ = s => document.querySelector(s);

/* =====================================================
   SAVE DATA (per class, in this browser)
   ===================================================== */
const KEY = 'twr-xmas-tree-v1', HUB_KEY = 'twr-hub-v1';
const params = new URLSearchParams(location.search);
const EMBED = params.has('embed');
const defaultTree = () => ({
  ornaments: [], topper: 'star',
  lights: {on:true, palette:'multi', effect:'twinkle'},
  room: {rug:'red', wall:'cream', fire:true, presents:true, dim:false, stockings:3, names:''}
});
let store;
try { store = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!store || !store.classes) store = {classes:{}, current:'default'};
let className = 'Our Class';
(function syncFromHub(){
  let hub = null;
  try { hub = JSON.parse(localStorage.getItem(HUB_KEY)); } catch(e) {}
  if (!hub || !Array.isArray(hub.classes) || !hub.classes.length) return;
  const want = params.get('class') || hub.current;
  const c = hub.classes.find(x => x.id === want) || hub.classes[0];
  store.current = c.id; className = c.name;
})();
if (!store.classes[store.current]) store.classes[store.current] = defaultTree();
const T = store.classes[store.current];
// fill in anything missing from older saves
const d0 = defaultTree();
T.lights = {...d0.lights, ...T.lights}; T.room = {...d0.room, ...T.room}; T.ornaments = T.ornaments || [];
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };
$('#classChip').textContent = className;

/* =====================================================
   RENDERER / CAMERA
   ===================================================== */
const canvas = $('#c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = .9;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x120c09);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(52, 1, 0.1, 100);
camera.position.set(1.2, 3.3, 9.2);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 2.35, 0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.enablePan = false;
controls.minDistance = 3.2; controls.maxDistance = 9.4;
controls.minPolarAngle = Math.PI * 0.18; controls.maxPolarAngle = Math.PI * 0.53;
controls.autoRotateSpeed = 1.2;

function resize(){
  const w = innerWidth, h = innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize();

/* =====================================================
   HELPERS
   ===================================================== */
function canvasTex(w, h, draw, repeat){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4;
  if (repeat){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
const std = (color, o={}) => new THREE.MeshStandardMaterial({color, roughness:.8, metalness:0, ...o});

/* =====================================================
   ROOM: floor, walls, window, fireplace
   ===================================================== */
const ROOM = 20, WALL_H = 7.5, HALF = ROOM/2;
const floorTex = canvasTex(1024, 1024, (g, w, h) => {
  const n = 8, pw = w / n;
  for (let i = 0; i < n; i++){
    for (let j = 0; j < 3; j++){
      const y0 = (j*h/3 + (i%2)*h/6) % h, len = h/3;
      const l = 32 + rnd()*14;
      g.fillStyle = `hsl(26,45%,${l}%)`; g.fillRect(i*pw, y0, pw, len); g.fillRect(i*pw, y0 - h, pw, len);
      g.strokeStyle = 'rgba(0,0,0,.08)';
      for (let k = 0; k < 10; k++){ g.beginPath(); const x = i*pw + rnd()*pw; g.moveTo(x, y0); g.bezierCurveTo(x+6, y0+len*.3, x-6, y0+len*.6, x+3, y0+len); g.stroke(); }
      g.fillStyle = 'rgba(0,0,0,.35)'; g.fillRect(i*pw, y0, pw, 3);
    }
    g.fillStyle = 'rgba(0,0,0,.45)'; g.fillRect(i*pw, 0, 3, h);
  }
}, [4, 4]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(ROOM, ROOM), std(0xffffff, {map:floorTex, roughness:.55}));
floor.rotation.x = -Math.PI/2; scene.add(floor);

const ceiling = new THREE.Mesh(new THREE.PlaneGeometry(ROOM, ROOM), std(0xe8e0d4));
ceiling.rotation.x = Math.PI/2; ceiling.position.y = WALL_H; scene.add(ceiling);

const wallTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#fff'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,0,0,.06)'; for (let x = 0; x < w; x += 32) g.fillRect(x, 0, 12, h);
}, [12, 4]);
const wallMat = std(0xf1e6cf, {map:wallTex, roughness:.95});
const walls = [
  {p:[0, WALL_H/2, -HALF], r:0}, {p:[0, WALL_H/2, HALF], r:Math.PI},
  {p:[-HALF, WALL_H/2, 0], r:Math.PI/2}, {p:[HALF, WALL_H/2, 0], r:-Math.PI/2},
];
for (const w of walls){
  const m = new THREE.Mesh(new THREE.PlaneGeometry(ROOM, WALL_H), wallMat);
  m.position.set(...w.p); m.rotation.y = w.r; scene.add(m);
  const base = new THREE.Mesh(new THREE.BoxGeometry(ROOM, .3, .06), std(0xf7f2ea));
  base.position.set(w.p[0], .15, w.p[2]); base.rotation.y = w.r; base.translateZ(.03); scene.add(base);
}

/* Window with falling snow (left wall) */
const win = new THREE.Group(); scene.add(win);
win.position.set(-HALF + .02, 3.3, 0.5); win.rotation.y = Math.PI/2;
const skyTex = canvasTex(256, 320, (g, w, h) => {
  const gr = g.createLinearGradient(0, 0, 0, h); gr.addColorStop(0, '#0b1636'); gr.addColorStop(1, '#3a3f78');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  g.fillStyle = '#fff'; for (let i = 0; i < 60; i++){ g.globalAlpha = rnd()*.8+.2; g.fillRect(rnd()*w, rnd()*h*.7, 1.5, 1.5); }
  g.globalAlpha = 1; g.fillStyle = '#fdf6d0'; g.beginPath(); g.arc(w*.72, h*.2, 22, 0, 7); g.fill();
  g.fillStyle = '#eef3ff'; g.beginPath(); g.moveTo(0, h); for (let x = 0; x <= w; x += 16) g.lineTo(x, h - 40 - Math.sin(x/30)*14); g.lineTo(w, h); g.fill();
  g.fillStyle = '#16301f'; for (const [x, s] of [[40,60],[110,85],[200,70]]){ g.beginPath(); g.moveTo(x, h-40-s); g.lineTo(x-s*.35, h-38); g.lineTo(x+s*.35, h-38); g.fill(); }
});
const WIN_W = 2.6, WIN_H = 3.1;
const glass = new THREE.Mesh(new THREE.PlaneGeometry(WIN_W, WIN_H), new THREE.MeshBasicMaterial({map:skyTex, toneMapped:false}));
win.add(glass);
const frameMat = std(0xf5f0e6, {roughness:.6});
for (const [w, h, x, y] of [[WIN_W+.3,.16,0,WIN_H/2],[WIN_W+.3,.16,0,-WIN_H/2],[.16,WIN_H,-WIN_W/2,0],[.16,WIN_H,WIN_W/2,0],[.07,WIN_H,0,0],[WIN_W,.07,0,0]]){
  const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, .14), frameMat); b.position.set(x, y, .06); win.add(b);
}
const sill = new THREE.Mesh(new THREE.BoxGeometry(WIN_W+.6, .1, .4), frameMat); sill.position.set(0, -WIN_H/2 - .08, .2); win.add(sill);
const SNOW_N = 160, snowPos = new Float32Array(SNOW_N * 3);
for (let i = 0; i < SNOW_N; i++){ snowPos[i*3] = (rnd()-.5)*WIN_W; snowPos[i*3+1] = (rnd()-.5)*WIN_H; snowPos[i*3+2] = .02; }
const snowGeo = new THREE.BufferGeometry(); snowGeo.setAttribute('position', new THREE.BufferAttribute(snowPos, 3));
const dotTex = canvasTex(64, 64, (g, w) => { const r = g.createRadialGradient(w/2,w/2,0,w/2,w/2,w/2); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.35,'rgba(255,255,255,.6)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle = r; g.fillRect(0,0,w,w); });
const snow = new THREE.Points(snowGeo, new THREE.PointsMaterial({size:.07, map:dotTex, transparent:true, depthWrite:false, toneMapped:false}));
win.add(snow);

/* Fireplace (back wall) */
const brickTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#d9cfc2'; g.fillRect(0, 0, w, h);
  const bh = 32, bw = 96;
  for (let r = 0; r < h/bh; r++) for (let c = -1; c < w/bw + 1; c++){
    const x = c*bw + (r%2 ? bw/2 : 0), l = 30 + rnd()*12;
    g.fillStyle = `hsl(${8+rnd()*8},${45+rnd()*15}%,${l}%)`; g.fillRect(x+3, r*bh+3, bw-6, bh-6);
  }
}, [1, 1]);
const fire = new THREE.Group(); scene.add(fire);
fire.position.set(-4.3, 0, -HALF + .45);
const brick = std(0xffffff, {map:brickTex, roughness:.9});
const addBox = (parent, w, h, d, x, y, z, mat) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y, z); parent.add(m); return m; };
addBox(fire, .95, 3.1, .8, -1.38, 1.55, 0, brick);
addBox(fire, .95, 3.1, .8,  1.38, 1.55, 0, brick);
addBox(fire, 1.85, 1.55, .8, 0, 2.32, 0, brick);
addBox(fire, 1.85, 1.55, .1, 0, .78, -.36, std(0x120a08));
addBox(fire, 4.5, .14, 1.5, 0, .07, .3, std(0x6d625a, {roughness:.7}));
const mantel = addBox(fire, 4.6, .22, 1.05, 0, 3.2, .1, std(0x5a3520, {roughness:.6}));
// logs
const logMat = std(0x4a2c18);
for (const [x, r] of [[-.3,.35],[.3,-.35],[0,0]]){
  const l = new THREE.Mesh(new THREE.CylinderGeometry(.11, .11, 1.1, 10), logMat);
  l.rotation.z = Math.PI/2; l.rotation.y = r; l.position.set(x*.4, .26 + (r === 0 ? .17 : 0), -.05); fire.add(l);
}
const flames = [];
const flameCols = [0xff5a1f, 0xff8a2a, 0xffc04a, 0xffe27a];
for (let i = 0; i < 7; i++){
  const f = new THREE.Mesh(new THREE.ConeGeometry(.16 + rnd()*.1, .7 + rnd()*.4, 10, 1, true),
    new THREE.MeshBasicMaterial({color:flameCols[i%4], transparent:true, opacity:.75, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, toneMapped:false}));
  f.position.set((rnd()-.5)*.8, .7, (rnd()-.5)*.2 - .05); f.userData = {base:f.position.y, ph:rnd()*10, sp:4+rnd()*4};
  fire.add(f); flames.push(f);
}
const fireLight = new THREE.PointLight(0xff8a3a, 6, 14, 1); fireLight.position.set(0, 1, .8); fire.add(fireLight);
const fireGlow = new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex, color:0xff8a3a, transparent:true, opacity:.55, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false}));
fireGlow.scale.set(2.2, 1.6, 1); fireGlow.position.set(0, .7, 0); fire.add(fireGlow);

/* Stockings */
const stockingGroup = new THREE.Group(); fire.add(stockingGroup);
const stockShape = new THREE.Shape();
stockShape.moveTo(-.22, 0); stockShape.lineTo(.22, 0); stockShape.lineTo(.22, -.72);
stockShape.quadraticCurveTo(.24, -.92, .44, -.95); stockShape.quadraticCurveTo(.64, -.98, .62, -1.13);
stockShape.quadraticCurveTo(.6, -1.28, .32, -1.28); stockShape.lineTo(.02, -1.28);
stockShape.quadraticCurveTo(-.22, -1.28, -.22, -1.02); stockShape.lineTo(-.22, 0);
const stockGeo = new THREE.ExtrudeGeometry(stockShape, {depth:.12, bevelEnabled:true, bevelThickness:.03, bevelSize:.03, bevelSegments:2});
function nameTexture(text, color='#b3122a'){
  return canvasTex(256, 96, (g, w, h) => {
    g.fillStyle = '#fbf8f2'; g.fillRect(0, 0, w, h);
    g.fillStyle = 'rgba(0,0,0,.05)'; for (let i = 0; i < 300; i++) g.fillRect(Math.random()*w, Math.random()*h, 3, 3);
    if (!text) return;
    g.fillStyle = color; g.textAlign = 'center'; g.textBaseline = 'middle';
    let size = 56; g.font = `800 ${size}px Nunito, Arial, sans-serif`;
    while (g.measureText(text).width > w - 20 && size > 20){ size -= 4; g.font = `800 ${size}px Nunito, Arial, sans-serif`; }
    g.fillText(text, w/2, h/2 + 3);
  });
}

const TIERS = [];
const foliage = [];
const NT = 7, Y0 = .75, TOP = 5.25;
for (let i = 0; i < NT; i++){
  const t = i/(NT-1);
  const r = 2.0 - 1.55*t, h = 1.55 - .55*t;
  const yb = Y0 + i * ((TOP - Y0 - h*0.55) / (NT-1) );
  const yt = (i === NT-1) ? TOP : yb + h;
  const hh = yt - yb;
  TIERS.push({r, yb, yt, h:hh});
  const geo = new THREE.ConeGeometry(r, hh, 30, 4);
  const pos = geo.attributes.position, v = new THREE.Vector3();
  for (let k = 0; k < pos.count; k++){
    v.fromBufferAttribute(pos, k);
    const rad = Math.hypot(v.x, v.z);
    if (rad > .001){
      const ang = Math.atan2(v.z, v.x);
      const atRim = v.y < -hh/2 + .01;
      const seg = Math.round((ang + Math.PI) / (Math.PI*2) * 30);
      let f = 1 + (Math.sin(ang*7 + i) * .03) + (Math.random() - .5) * .05;
      if (atRim && seg % 2 === 0){ f *= 1.1; v.y -= .12; }
      v.x *= f; v.z *= f;
    }
    pos.setXYZ(k, v.x, v.y, v.z);
  }

  const col = new THREE.Color().setHSL(.36, .62, .095 + t*.035);
  const m = new THREE.Mesh(geo, std(col, {flatShading:true, roughness:1, envMapIntensity:.12}));

}

function setHover(idx){
  if (hoverIdx === idx) return;
  const paint = (i, on) => { const o = ornObjs[i]; if (!o) return; o.traverse(m => { if (m.material && m.material.emissive){ if (on){ m.userData.e = m.material.emissive.getHex(); m.userData.ei = m.material.emissiveIntensity; m.material.emissive.setHex(0xff2020); m.material.emissiveIntensity = .9; } else if (m.userData.e !== undefined){ m.material.emissive.setHex(m.userData.e); m.material.emissiveIntensity = m.userData.ei; } } }); };
  if (hoverIdx >= 0 && mode === 'remove') paint(hoverIdx, false);
  hoverIdx = idx;
  if (hoverIdx >= 0 && mode === 'remove') paint(hoverIdx, true);
}
function ornamentHit(){
  const hits = ray.intersectObjects(ornObjs, true);
  if (!hits.length) return -1;
  let o = hits[0].object; while (o && o.userData.idx === undefined) o = o.parent;
  return o ? o.userData.idx : -1;
}
let down = null;
canvas.addEventListener('pointerdown', e => { down = {x:e.clientX, y:e.clientY, t:performance.now()}; });
canvas.addEventListener('pointermove', e => {
  setRay(e);
  const idx = ornamentHit();
  const tip = $('#tip');
  if (idx >= 0 && T.ornaments[idx] && T.ornaments[idx].name && !showNames){ tip.textContent = T.ornaments[idx].name; tip.style.left = e.clientX + 'px'; tip.style.top = e.clientY + 'px'; tip.classList.remove('hidden'); }
  else tip.classList.add('hidden');
  if (mode === 'remove'){ setHover(idx); }
  if (mode === 'decorate' && ghost && e.pointerType !== 'touch'){
    const hit = ray.intersectObjects(foliage, false)[0];
    if (hit){ const p = placementFromHit(hit); ghost.position.set(p.x, p.y, p.z); ghost.rotation.y = p.ry + (curType === 'gift' ? .5 : 0); ghost.visible = true; }
    else ghost.visible = false;
  }
});
canvas.addEventListener('pointerleave', () => { if (ghost) ghost.visible = false; $('#tip').classList.add('hidden'); });
canvas.addEventListener('pointerup', e => {
  if (!down) return;
  const moved = Math.hypot(e.clientX - down.x, e.clientY - down.y), dt = performance.now() - down.t;
  down = null;
  if (moved > 6 || dt > 600) return;   // that was a drag to look around
  setRay(e);
  if (mode === 'decorate'){
    if (T.ornaments.length >= 400){ toast('The tree is full! (400 ornaments)'); return; }
    const hit = ray.intersectObjects(foliage, false)[0];
    if (!hit) return;
    const o = {t:curType, c:curColour, s:curSize, ...placementFromHit(hit)};
    const nm = $('#nameIn').value.trim(); if (nm) o.name = nm;
    T.ornaments.push(o); undo.push({type:'add'});
    save(); rebuildOrnaments(); sparkle(hit.point);
  } else if (mode === 'remove'){
    const idx = ornamentHit(); if (idx < 0) return;
    const [o] = T.ornaments.splice(idx, 1); undo.push({type:'remove', o, idx});
    hoverIdx = -1; save(); rebuildOrnaments();
  }
});
const undo = [];
$('#undoBtn').onclick = () => {
  const a = undo.pop(); if (!a) { toast('Nothing to undo'); return; }
  if (a.type === 'add') T.ornaments.pop();
  else T.ornaments.splice(a.idx, 0, a.o);
  save(); rebuildOrnaments();
};

/* little sparkle when an ornament is hung */
const sparkles = [];
function sparkle(p){
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:dotTex, color:0xfff2a8, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, toneMapped:false}));
  s.position.copy(p); s.scale.setScalar(.2); scene.add(s); sparkles.push({s, t:0});
}

/* Name labels (all at once) */
let showNames = false;
const labelEls = [];
function rebuildLabels(){
  const box = $('#labels'); box.innerHTML = ''; labelEls.length = 0;
  if (!showNames) return;
  T.ornaments.forEach((o, i) => { if (!o.name) return; const d = document.createElement('div'); d.className = 'lbl'; d.textContent = o.name; box.appendChild(d); labelEls.push({d, i}); });
}
const v3 = new THREE.Vector3(), camDir = new THREE.Vector3();
function updateLabels(){
  if (!showNames || !labelEls.length) return;
  camDir.set(camera.position.x, 0, camera.position.z).normalize();
  for (const {d, i} of labelEls){
    const o = T.ornaments[i]; if (!o) continue;
    const front = (o.x * camDir.x + o.z * camDir.z) > -.1;
    v3.set(o.x, o.y, o.z); tree.localToWorld(v3); v3.project(camera);
    d.style.display = front && v3.z < 1 ? 'block' : 'none';
    d.style.left = ((v3.x + 1) / 2 * innerWidth) + 'px';
    d.style.top = ((1 - v3.y) / 2 * innerHeight) + 'px';
  }
}
$('#namesBtn').onclick = () => { showNames = !showNames; $('#namesBtn').classList.toggle('on', showNames); rebuildLabels(); };

/* =====================================================
   UI
   ===================================================== */
function setMode(m){
  mode = m; setHover(-1);
  document.body.className = 'mode-' + m;
  document.querySelectorAll('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === m));
  $('#tray').classList.toggle('hidden', m !== 'decorate');
  if (ghost) ghost.visible = false;
  toast(m === 'decorate' ? 'Click the tree to hang an ornament · Drag to look around' : m === 'remove' ? 'Click an ornament to take it off' : 'Drag to walk around the tree · Scroll to zoom');
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => setMode(b.dataset.mode));

const ornRow = $('#ornRow');
ORN_TYPES.forEach(t => {
  const b = document.createElement('button'); b.className = 'orn-btn' + (t.id === curType ? ' on' : '');
  b.innerHTML = `<span class="ico">${t.ico}</span>${t.label}`;
  b.onclick = () => { curType = t.id; ornRow.querySelectorAll('.orn-btn').forEach(x => x.classList.remove('on')); b.classList.add('on'); rebuildGhost(); };
  ornRow.appendChild(b);
});
const colRow = $('#colRow');
COLOURS.forEach(c => {
  const b = document.createElement('button'); b.className = 'sw' + (c === curColour ? ' on' : ''); b.style.background = c; b.title = c;
  b.onclick = () => { curColour = c; colRow.querySelectorAll('.sw').forEach(x => x.classList.remove('on')); b.classList.add('on'); rebuildGhost(); };
  colRow.appendChild(b);
});
$('#sizeSeg').querySelectorAll('button').forEach(b => b.onclick = () => {
  curSize = +b.dataset.s; $('#sizeSeg').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); rebuildGhost();
});
$('#nameIn').addEventListener('keydown', e => e.stopPropagation());

function optionRow(el, options, get, set){
  const row = $(el); row.innerHTML = '';
  for (const [val, label] of options){
    const b = document.createElement('button'); b.className = 'opt' + (get() === val ? ' on' : ''); b.innerHTML = label;
    b.onclick = () => { set(val); row.querySelectorAll('.opt').forEach(x => x.classList.remove('on')); b.classList.add('on'); save(); };
    row.appendChild(b);
  }
}
function buildDrawer(){
  optionRow('#lightsOn', [[true,'💡 Lights on'],[false,'🌑 Lights off']], () => T.lights.on, v => T.lights.on = v);
  optionRow('#paletteRow', Object.entries(PALETTES).map(([k, p]) => [k, `<span style="display:inline-flex;gap:2px;margin-right:6px">${p.cols.map(c => `<i style="width:10px;height:10px;border-radius:50%;background:${c};display:inline-block"></i>`).join('')}</span>${p.label}`]), () => T.lights.palette, v => { T.lights.palette = v; applyPalette(); });
  optionRow('#effectRow', Object.entries(EFFECTS), () => T.lights.effect, v => T.lights.effect = v);
  optionRow('#topperRow', [['star','⭐ Star'],['bow','🎀 Bow'],['snowflake','❄️ Snowflake'],['none','None']], () => T.topper, v => { T.topper = v; buildTopper(); });
  optionRow('#roomLightRow', [[false,'☀️ Room lights on'],[true,'🌙 Lights out']], () => T.room.dim, v => { T.room.dim = v; applyRoom(); });
  optionRow('#rugRow', [['red','Red & gold'],['plaid','Plaid'],['braid','Braided'],['white','Fluffy white'],['none','No rug']], () => T.room.rug, v => { T.room.rug = v; buildRug(); });
  optionRow('#wallRow', [['cream','Cream'],['sage','Sage'],['mint','Mint'],['grey','Grey'],['navy','Navy'],['red','Cranberry']], () => T.room.wall, v => { T.room.wall = v; applyRoom(); });
  optionRow('#fireRow', [[true,'🔥 Fire on'],[false,'Fire off']], () => T.room.fire, v => { T.room.fire = v; applyRoom(); });
  optionRow('#presentRow', [[true,'🎁 Presents'],[false,'No presents']], () => T.room.presents, v => { T.room.presents = v; applyRoom(); });
  $('#stockCount').value = T.room.stockings; $('#stockCountLbl').textContent = T.room.stockings;
  $('#stockNames').value = T.room.names || '';
}
$('#stockCount').oninput = e => { T.room.stockings = +e.target.value; $('#stockCountLbl').textContent = T.room.stockings; buildStockings(); save(); };
$('#stockNames').addEventListener('keydown', e => e.stopPropagation());
$('#stockNames').oninput = e => {
  T.room.names = e.target.value;
  const n = e.target.value.split(',').filter(s => s.trim()).length;
  if (n > T.room.stockings){ T.room.stockings = Math.min(8, n); $('#stockCount').value = T.room.stockings; $('#stockCountLbl').textContent = T.room.stockings; }
  buildStockings(); save();
};
$('#clearBtn').onclick = () => {
  if (!T.ornaments.length) return;
  if (!confirm(`Take all ${T.ornaments.length} ornaments off the tree? This can't be undone.`)) return;
  T.ornaments = []; undo.length = 0; save(); rebuildOrnaments();
};
$('#drawerBtn').onclick = () => $('#drawer').classList.toggle('open');
$('#closeDrawer').onclick = () => $('#drawer').classList.remove('open');
$('#spinBtn').onclick = () => { controls.autoRotate = !controls.autoRotate; $('#spinBtn').classList.toggle('on', controls.autoRotate); };
$('#photoBtn').onclick = () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = `${className.replace(/[^\w-]+/g, '-')}-christmas-tree.png`;
  a.href = canvas.toDataURL('image/png'); a.click();
};
$('#fsBtn').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(()=>{}); };
if (EMBED){
  $('#hubBtn').classList.remove('hidden'); $('#fsBtn').classList.add('hidden');
  $('#hubBtn').onclick = () => window.parent.postMessage({type:'twr-close'}, '*');
}
let toastTimer;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 3500); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') $('#drawer').classList.remove('open');
  if ((e.ctrlKey || e.metaKey) && e.key === 'z'){ e.preventDefault(); $('#undoBtn').click(); }
});

/* =====================================================
   START
   ===================================================== */
applyPalette(); buildTopper(); applyRoom(); buildDrawer(); rebuildOrnaments(); save(); rebuildGhost(); setMode('decorate');
$('#loading').remove();
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  controls.update();
  updateLights(t);
  if (T.room.fire){
    for (const f of flames){ const u = f.userData, k = .75 + .35 * Math.sin(t*u.sp + u.ph) * Math.sin(t*u.sp*.37 + u.ph*2); f.scale.set(1, k, 1); f.position.y = u.base * (.85 + k*.15); f.material.opacity = .45 + .35*k; }
    fireLight.intensity = 5 + Math.sin(t*9)*.8 + Math.sin(t*23)*.5;
  }
  const sp = snow.geometry.attributes.position;
  for (let i = 0; i < SNOW_N; i++){ let y = sp.getY(i) - dt*(.25 + (i%5)*.06); if (y < -WIN_H/2) y = WIN_H/2; sp.setY(i, y); sp.setX(i, sp.getX(i) + Math.sin(t + i)*.0015); }
  sp.needsUpdate = true;
  if (T.topper !== 'none' && topper.children[0]) topper.rotation.y = Math.sin(t*.6) * .5;
  for (let i = sparkles.length - 1; i >= 0; i--){ const s = sparkles[i]; s.t += dt; s.s.scale.setScalar(.2 + s.t*2.2); s.s.material.opacity = 1 - s.t/.5; if (s.t > .5){ scene.remove(s.s); sparkles.splice(i, 1); } }
  updateLabels();
  renderer.render(scene, camera);
});
</script>
</body>
