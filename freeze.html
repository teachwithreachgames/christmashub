<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Freeze Dance | Teach With Reach Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#fdf6e3;--gold:#f5c542;--red:#d64045;--green:#2fbf71;--ice:#bfe9ff;--panel:rgba(255,255,255,.1);--line:rgba(255,255,255,.2)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1030}
body{font-family:Nunito,system-ui,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none}
button{font:inherit}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;min-height:46px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.on,.btn.gold{background:var(--gold);color:#2a1d00;border-color:transparent}

/* dance floor */
#floor{position:fixed;inset:0;overflow:hidden;background:radial-gradient(1200px 700px at 50% 120%,#3a1d6e,#0b1030 70%)}
.light{position:absolute;top:-30%;width:40vw;height:140vh;opacity:0;filter:blur(30px);transform-origin:50% 0;transition:opacity .5s;mix-blend-mode:screen}
body.dance .light{opacity:.45;animation:sweep 3s ease-in-out infinite alternate}
.light.l1{left:5%;background:linear-gradient(#ff4d6d,transparent)}
.light.l2{left:30%;background:linear-gradient(#2fbf71,transparent);animation-delay:-1s!important}
.light.l3{left:55%;background:linear-gradient(#4aa3ff,transparent);animation-delay:-2s!important}
.light.l4{left:78%;background:linear-gradient(#f5c542,transparent);animation-delay:-.5s!important}
@keyframes sweep{from{transform:rotate(-25deg)}to{transform:rotate(25deg)}}
.flake{position:absolute;top:-20px;color:#fff;opacity:.8;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.dancers{position:absolute;left:0;right:0;bottom:16vh;display:flex;justify-content:center;gap:clamp(10px,3vw,48px)}
.dancers span{font-size:clamp(60px,10vw,150px);display:inline-block;filter:drop-shadow(0 10px 10px rgba(0,0,0,.4))}
body.dance .dancers span{animation:boogie .5s ease-in-out infinite alternate}
.dancers span:nth-child(2n){animation-delay:-.25s!important}
.dancers span:nth-child(3n){animation-duration:.42s!important}
@keyframes boogie{0%{transform:translateY(0) rotate(-12deg)}100%{transform:translateY(-34px) rotate(12deg)}}
.big{position:absolute;left:0;right:0;top:20vh;text-align:center;font-family:'Lilita One',cursive;font-size:clamp(60px,11vw,170px);line-height:1;text-shadow:0 8px 0 rgba(0,0,0,.25)}
body.dance .big{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.06)}}
.sub{position:absolute;left:0;right:0;top:calc(20vh + clamp(70px,12vw,190px));text-align:center;font-weight:900;font-size:clamp(18px,2vw,28px);opacity:.9}

/* freeze screen */
#freeze{position:fixed;inset:0;z-index:5;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(220,245,255,.97),rgba(120,190,235,.97));color:#0b3b5c;opacity:0;pointer-events:none;transition:opacity .15s}
body.frozen #freeze{opacity:1;pointer-events:auto}
#freeze .f{font-family:'Lilita One',cursive;font-size:clamp(90px,17vw,260px);line-height:.9;letter-spacing:2px;color:#fff;-webkit-text-stroke:6px #2b8fd1;paint-order:stroke;text-shadow:0 10px 0 rgba(30,100,160,.35)}
body.frozen #freeze .f{animation:slam .35s cubic-bezier(.2,1.8,.4,1)}
@keyframes slam{from{transform:scale(2.2);opacity:0}to{transform:scale(1);opacity:1}}
#freeze .pose{font-weight:900;font-size:clamp(26px,3.4vw,52px);margin-top:10px}
#freeze .pose b{font-size:1.5em}
#freeze .out{font-weight:800;font-size:clamp(18px,2vw,28px);margin-top:10px;opacity:.85}
#freeze .cd{font-family:'Lilita One',cursive;font-size:clamp(40px,5vw,80px);margin-top:12px;color:#2b8fd1}
.ice{position:fixed;inset:0;pointer-events:none;background:
  radial-gradient(circle at 0 0,rgba(255,255,255,.9) 0 80px,transparent 160px),
  radial-gradient(circle at 100% 0,rgba(255,255,255,.9) 0 80px,transparent 160px),
  radial-gradient(circle at 0 100%,rgba(255,255,255,.9) 0 80px,transparent 160px),
  radial-gradient(circle at 100% 100%,rgba(255,255,255,.9) 0 80px,transparent 160px)}

/* top + bottom bars */
header{position:fixed;left:0;right:0;top:0;z-index:8;display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.35);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-family:'Lilita One',cursive;font-weight:400;margin:0 6px;font-size:clamp(20px,2vw,30px);white-space:nowrap}
h1 span{color:var(--ice)}
.spacer{flex:1}
.now{font-weight:800;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:40vw}
.controls{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:8;display:flex;gap:10px;align-items:center;background:rgba(0,0,0,.45);border:1px solid var(--line);border-radius:22px;padding:10px 12px;backdrop-filter:blur(6px)}
.go{font-family:'Lilita One',cursive;font-weight:400;font-size:clamp(22px,2.2vw,30px);padding:12px 28px;min-height:64px;border-radius:18px;border:0;cursor:pointer}
.go.start{background:var(--green);color:#052b16;box-shadow:0 6px 0 #1a7a46}
.go.stop{background:var(--gold);color:#2a1d00;box-shadow:0 6px 0 #a8841f}
.go.frz{background:var(--ice);color:#0b3b5c;box-shadow:0 6px 0 #6fb6dc}
.go:active{transform:translateY(3px)}
.vid{position:fixed;right:16px;top:76px;width:260px;aspect-ratio:16/9;border-radius:14px;overflow:hidden;z-index:4;box-shadow:0 10px 30px rgba(0,0,0,.5);background:#000}
.vid #player,.vid iframe{position:absolute;inset:0;width:100%;height:100%}
.vid .cover{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(135deg,#3a1d6e,#0b1030);font-size:56px}
.vid.show .cover{display:none}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:20;padding:16px}
.sheet{background:#141a44;border:1px solid var(--line);border-radius:20px;padding:18px 22px;width:min(640px,100%);max-height:90vh;overflow:auto}
.sheet h2{font-family:'Lilita One',cursive;font-weight:400;margin:0 0 6px;color:var(--gold)}
.sheet h3{margin:16px 0 6px;font-size:17px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:rgba(255,255,255,.08);color:var(--cream);border:2px solid transparent;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}
.opt.on{border-color:var(--gold);background:rgba(245,197,66,.18)}
.hint{opacity:.7;font-size:14px;margin:4px 0}
select{font:inherit;width:100%;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--line)}
select option{color:#111}
</style>
<script data-goatcounter="https://teachwithreach.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<div id="floor">
  <div class="light l1"></div><div class="light l2"></div><div class="light l3"></div><div class="light l4"></div>
  <div id="flakes"></div>
  <div class="big" id="big">Freeze Dance!</div>
  <div class="sub" id="sub">Press ▶ Start. When the music stops… FREEZE!</div>
  <div class="dancers"><span>🧝</span><span>⛄</span><span>🦌</span><span>🎅</span><span>🐧</span></div>
</div>

<div id="freeze">
  <div class="ice"></div>
  <div>
    <div class="f">FREEZE!</div>
    <div class="pose" id="pose"></div>
    <div class="out" id="out"></div>
    <div class="cd" id="cd"></div>
  </div>
</div>

<header>
  <button class="btn hidden" id="hubBtn">🏠 Hub</button>
  <h1>❄️ Freeze <span>Dance</span></h1>
  <span class="now" id="now"></span>
  <div class="spacer"></div>
  <button class="btn" id="vidBtn" title="Show or hide the music video">📺 Video</button>
  <button class="btn" id="setBtn">⚙ Settings</button>
</header>

<div class="vid" id="vid"><div id="player"></div><div class="cover">🎶</div></div>

<div class="controls">
  <button class="go start" id="goBtn">▶ Start</button>
  <button class="go frz" id="frzBtn" title="Freeze right now (F key)">🧊 Freeze!</button>
  <button class="btn" id="skipBtn" title="Next song">⏭ Song</button>
</div>

<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search), EMBED = params.has('embed');
function track(name){ try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({path:'event/' + name, title:name, event:true}); } catch(e) {} }

/* same song list as Name That Tune; links you change in Name That Tune's ⚙ Songs are used here too */
const SONGS = [
  {id:'rudolph',  e:'🦌', title:'Rudolph the Red-Nosed Reindeer',    artist:'Gene Autry',              yt:'RasL_erhu4Y', alt:'bDx89N03mPw'},
  {id:'frosty',   e:'⛄', title:'Frosty the Snowman',                artist:'Gene Autry',              yt:'oda3A5j5du4', alt:'-BLPMsoGbWA'},
  {id:'jingle',   e:'🔔', title:'Jingle Bells',                      artist:'Frank Sinatra',           yt:'-aQw3DoGuqs', alt:'hLf0-lro8X8'},
  {id:'comin',    e:'🎅', title:"Santa Claus Is Comin' to Town",     artist:'The Jackson 5',           yt:'nYmPZrvThW8', alt:'nI9Bg38BKCk'},
  {id:'herecomes',e:'🛷', title:'Here Comes Santa Claus',            artist:'Gene Autry',              yt:'oNwG28tZDsg', alt:'JhcLpwlA-ZA'},
  {id:'wewish',   e:'🎶', title:'We Wish You a Merry Christmas',     artist:'Gene Autry',              yt:'YCVE2JuOeBo', alt:'LwAyfuaOjUE'},
  {id:'deck',     e:'🌿', title:'Deck the Halls',                    artist:'Nat King Cole',           yt:'wQlQQ55wNyA', alt:'kORRidv-p0Y'},
  {id:'housetop', e:'🏠', title:'Up on the Housetop',                artist:'Gene Autry',              yt:'ISqjyIdmZQs', alt:'5xSlmQkIz8w'},
  {id:'holly',    e:'🎄', title:'A Holly Jolly Christmas',           artist:'Burl Ives',               yt:'P_dI6fVZwd0', alt:'9QEK4K-KWT8'},
  {id:'jbrock',   e:'🎸', title:'Jingle Bell Rock',                  artist:'Bobby Helms',             yt:'ZnDmmiiFSUU', alt:'Z0ajuTaHBtM'},
  {id:'rockin',   e:'💃', title:"Rockin' Around the Christmas Tree", artist:'Brenda Lee',              yt:'TFsZy9t-qDc', alt:'O1x-hOOrl5E'},
  {id:'feliz',    e:'🪅', title:'Feliz Navidad',                     artist:'José Feliciano',          yt:'N8NcQzMQN_U', alt:''},
  {id:'letitsnow',e:'❄️', title:'Let It Snow! Let It Snow! Let It Snow!', artist:'Dean Martin',        yt:'Rnil5LyK_B0', alt:'2TA3IKH8Y5c'},
  {id:'mariah',   e:'🎁', title:'All I Want for Christmas Is You',   artist:'Mariah Carey',            yt:'aAkMkVFwAoo', alt:'fRyhqobl0sk'},
  {id:'grinch',   e:'💚', title:"You're a Mean One, Mr. Grinch",     artist:'Thurl Ravenscroft',       yt:'cGSneujgGT8', alt:'60CYXuc7ATk'},
  {id:'mustbe',   e:'🧔', title:'Must Be Santa',                     artist:'Bob Dylan',               yt:'Hoh7m3qHqf0', alt:'a8qE6WQmNus'},
  {id:'runrudolph',e:'🏃', title:'Run Rudolph Run',                  artist:'Chuck Berry',             yt:'YiadNVhaGwk', alt:'3tQLBSt80Ac'},
  {id:'sleigh',   e:'🐴', title:'Sleigh Ride',                       artist:'The Ronettes',            yt:'XZTzai1H9DM', alt:'oH4WG1x_KR8'},
  {id:'chipmunk', e:'🐿️', title:"The Chipmunk Song (Christmas Don't Be Late)", artist:'Alvin & the Chipmunks', yt:'mDtOwSjIDFw', alt:'N7xALO9ocvo'},
  {id:'silent',   e:'⭐', title:'Silent Night',                      artist:'Bing Crosby',             yt:'moHobaO9TlM', alt:'bmJnKCr1dNk'},
];
const POSES = [
  ['⛄', 'a snowman'], ['🦌', 'a reindeer (hands up for antlers!)'], ['🎄', 'a Christmas tree (arms out wide!)'], ['⭐', 'a star'],
  ['🧝', 'a sneaky elf'], ['🐧', 'a penguin'], ['🧊', 'an icicle (stand tall and straight!)'], ['🎅', 'Santa (hold your belly!)'],
  ['🎁', 'a present (curl up small!)'], ['🍪', 'a gingerbread cookie'], ['🍭', 'a candy cane (bend to the side!)'], ['🤖', 'a toy robot'],
];
const TIMING = {short:[4, 8, 'Short (4–8 s)'], medium:[6, 14, 'Medium (6–14 s)'], long:[10, 22, 'Long (10–22 s)']};

/* settings (per browser) */
const KEY = 'twr-freeze-v1';
let S; try { S = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
S = Object.assign({timing:'medium', hold:4, poses:true, elim:false, video:false, song:'shuffle'}, S || {});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} };
let tuneSongs = {}; try { tuneSongs = (JSON.parse(localStorage.getItem('twr-tune-v1')) || {}).songs || {}; } catch(e) {}
function song(id){ const s = SONGS.find(x => x.id === id), o = tuneSongs[id] || {}; const custom = o.yt && o.yt !== s.yt; return {...s, yt:o.yt || s.yt, alt:custom ? '' : s.alt, off:!!o.off}; }
const pool = () => SONGS.map(s => song(s.id)).filter(s => !s.off);

/* =====================================================
   PLAYER
   ===================================================== */
let player = null, ready = false, cur = null, triedAlt = false, deck = [];
let mode = 'idle';            // idle | dance | frozen | paused
let danceLeft = 0, holdLeft = 0, tick = null, lastPose = -1, wantPlay = false;
const tag = document.createElement('script'); tag.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(tag);
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player('player', {
    width:'100%', height:'100%',
    playerVars:{playsinline:1, rel:0, controls:0, disablekb:1, fs:0, iv_load_policy:3, origin:/^https?:/.test(location.protocol) ? location.origin : undefined},
    events:{
      onReady:() => { ready = true; if (wantPlay) start(); },
      onStateChange:e => { if (e.data === YT.PlayerState.ENDED && mode === 'dance'){ loadNext(true); } },
      onError:() => {
        if (!triedAlt && cur && cur.alt){ triedAlt = true; player.loadVideoById(cur.alt); return; }
        loadNext(mode === 'dance');
      },
    }
  });
};
function pickSong(){
  if (S.song !== 'shuffle'){ const s = pool().find(x => x.id === S.song); if (s) return s; }
  if (!deck.length) deck = pool().sort(() => Math.random() - .5);
  return deck.pop();
}
function loadNext(play){
  cur = pickSong(); triedAlt = false;
  $('#now').textContent = `${cur.e} ${cur.title}`;
  if (!ready) return;
  if (play) player.loadVideoById(cur.yt); else player.cueVideoById(cur.yt);
}
const isPlaying = () => { try { return player.getPlayerState() === YT.PlayerState.PLAYING; } catch(e){ return false; } };
const rnd = (a, b) => a + Math.random() * (b - a);

function start(){
  if (!ready){ wantPlay = true; setBig('Loading…', 'Getting the music ready'); return; }
  wantPlay = false;
  if (!cur) loadNext(true); else player.playVideo();
  dance(true);
  track('freeze-start');
}
function dance(newTimer){
  mode = 'dance'; document.body.className = 'dance';
  if (newTimer || danceLeft <= 0){ const [a, b] = TIMING[S.timing]; danceLeft = rnd(a, b); }
  setBig('DANCE!', '💃 Keep moving until the music stops! 🕺');
  try { player.playVideo(); } catch(e) {}
  runTick(); renderButtons();
}
function freeze(){
  if (mode !== 'dance') return;
  mode = 'frozen'; document.body.className = 'frozen';
  try { player.pauseVideo(); } catch(e) {}
  let i; do { i = Math.floor(Math.random() * POSES.length); } while (i === lastPose && POSES.length > 1); lastPose = i;
  $('#pose').innerHTML = S.poses ? `Freeze like ${POSES[i][1]}! <b>${POSES[i][0]}</b>` : 'Don’t move a muscle!';
  $('#out').textContent = S.elim ? 'If you wiggle, you’re out. Sit down!' : '';
  holdLeft = S.hold;
  $('#cd').textContent = S.hold ? `Dance again in ${Math.ceil(holdLeft)}…` : 'Press ▶ to dance again';
  runTick(); renderButtons();
}
function pause(){
  mode = 'paused'; document.body.className = '';
  try { player.pauseVideo(); } catch(e) {}
  setBig('Paused', 'Press ▶ to keep dancing'); renderButtons();
}
function runTick(){
  clearInterval(tick);
  let last = performance.now();
  tick = setInterval(() => {
    const now = performance.now(), dt = (now - last) / 1000; last = now;
    if (mode === 'dance' && isPlaying()){ danceLeft -= dt; if (danceLeft <= 0) freeze(); }
    else if (mode === 'frozen' && S.hold){
      holdLeft -= dt; $('#cd').textContent = `Dance again in ${Math.max(1, Math.ceil(holdLeft))}…`;
      if (holdLeft <= 0) dance(true);
    }
  }, 100);
}
function setBig(t, s){ $('#big').textContent = t; $('#sub').textContent = s; }
function renderButtons(){
  const g = $('#goBtn');
  if (mode === 'dance'){ g.textContent = '⏸ Pause'; g.className = 'go stop'; }
  else { g.textContent = mode === 'idle' ? '▶ Start' : '▶ Dance!'; g.className = 'go start'; }
}
$('#goBtn').onclick = () => { if (mode === 'dance') pause(); else if (mode === 'idle') start(); else dance(mode === 'frozen'); };
$('#frzBtn').onclick = () => { if (mode === 'dance') freeze(); };
$('#freeze').onclick = () => { if (mode === 'frozen') dance(true); };
$('#skipBtn').onclick = () => { loadNext(mode === 'dance'); };
$('#vidBtn').onclick = () => { S.video = !S.video; save(); applyVideo(); };
function applyVideo(){ $('#vid').classList.toggle('show', S.video); $('#vidBtn').classList.toggle('on', S.video); }
addEventListener('keydown', e => {
  if (!$('#modal').classList.contains('hidden')) return;
  if (e.key === ' '){ e.preventDefault(); $('#goBtn').click(); }
  if (e.key === 'f' || e.key === 'F') $('#frzBtn').click();
});

/* settings */
function opts(name, list, curv){ return `<div class="opts" data-name="${name}">${list.map(([v, l]) => `<button class="opt${String(v) === String(curv) ? ' on' : ''}" data-v="${v}">${l}</button>`).join('')}</div>`; }
$('#setBtn').onclick = () => {
  $('#sheet').innerHTML = `<h2>⚙ Freeze Dance settings</h2>
    <h3>🎵 How long do we dance before each freeze?</h3>${opts('timing', Object.entries(TIMING).map(([k, v]) => [k, v[2]]), S.timing)}
    <p class="hint">Each freeze comes at a random time in this range, so no one can guess it.</p>
    <h3>🧊 How long do we stay frozen?</h3>${opts('hold', [[3, '3 seconds'], [4, '4 seconds'], [6, '6 seconds'], [10, '10 seconds'], [0, 'Until I press ▶']], S.hold)}
    <h3>🤸 Freeze poses</h3>${opts('poses', [[true, 'On: "Freeze like a snowman!"'], [false, 'Off']], S.poses)}
    <h3>🪑 Elimination</h3>${opts('elim', [[false, 'Off'], [true, 'On: wigglers sit down']], S.elim)}
    <h3>🎶 Music</h3>
    <select id="songSel"><option value="shuffle">🔀 Shuffle all the songs</option>${pool().map(s => `<option value="${s.id}"${S.song === s.id ? ' selected' : ''}>${s.e} ${esc(s.title)}</option>`).join('')}</select>
    <p class="hint">Songs and links come from Name That Tune’s ⚙ Songs list.</p>
    <div style="display:flex;justify-content:flex-end;margin-top:16px"><button class="btn gold" id="closeSet">Done</button></div>`;
  $('#modal').classList.remove('hidden');
  $('#sheet').querySelectorAll('.opts').forEach(g => g.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    let v = b.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; else if (/^\d+$/.test(v)) v = +v;
    S[g.dataset.name] = v; save(); g.querySelectorAll('.opt').forEach(x => x.classList.toggle('on', x === b));
  }));
  $('#songSel').onchange = e => { S.song = e.target.value; deck = []; save(); if (S.song !== 'shuffle') loadNext(mode === 'dance'); };
  $('#closeSet').onclick = () => $('#modal').classList.add('hidden');
};
$('#modal').onclick = e => { if (e.target.id === 'modal') $('#modal').classList.add('hidden'); };

/* falling snow */
for (let i = 0; i < 40; i++){
  const f = document.createElement('div'); f.className = 'flake'; f.textContent = '❄';
  f.style.left = Math.random() * 100 + '%'; f.style.fontSize = (10 + Math.random() * 22) + 'px';
  f.style.animationDuration = (6 + Math.random() * 8) + 's'; f.style.animationDelay = (-Math.random() * 14) + 's';
  $('#flakes').appendChild(f);
}
if (EMBED){ $('#hubBtn').classList.remove('hidden'); $('#hubBtn').onclick = () => { try { player && player.stopVideo(); } catch(e) {} clearInterval(tick); window.parent.postMessage({type:'twr-close'}, '*'); }; }
if (location.protocol === 'file:'){
  const bar = document.createElement('div');
  bar.style.cssText = 'position:fixed;left:50%;top:70px;transform:translateX(-50%);z-index:900;background:#d64045;color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;box-shadow:0 6px 20px rgba(0,0,0,.5);max-width:92vw;text-align:center';
  bar.textContent = '⚠ Music won’t play when this file is opened from your computer. Upload it to your website (GitHub Pages) and open it from there.';
  document.body.appendChild(bar);
}
