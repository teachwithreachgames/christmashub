<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa Summit | Teach With Reach Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#fdf6e3;--gold:#f5c542;--red:#d64045;--green:#2fbf71;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1530}
body{font-family:Nunito,system-ui,sans-serif;color:var(--cream);display:flex;flex-direction:column}
button,input{font:inherit}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;min-height:46px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.on,.btn.gold{background:var(--gold);color:#2a1d00;border-color:transparent}
.btn:disabled{opacity:.45;cursor:default}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.35);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:2}
h1{font-family:'Lilita One',cursive;font-weight:400;margin:0 6px;font-size:clamp(20px,2vw,30px);white-space:nowrap}
h1 span{color:var(--gold)}
.spacer{flex:1}
.pill{font-weight:900;background:rgba(255,255,255,.1);border-radius:999px;padding:6px 12px;white-space:nowrap}

.wrap{flex:1;display:grid;grid-template-columns:1fr minmax(340px,400px);min-height:0}
#scene{width:100%;height:100%;display:block}
.stagebox{position:relative;min-height:0}
.panel{background:rgba(0,0,0,.35);border-left:1px solid var(--line);padding:16px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.item{background:var(--cream);color:#1b2240;border-radius:20px;padding:16px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.item .em{font-size:68px;line-height:1}
.item .nm{font-family:'Lilita One',cursive;font-size:26px;line-height:1.1;margin:6px 0 4px}
.item .dt{font-weight:700;color:#4a5170;font-size:15px}
.item .rule{display:inline-block;margin-top:10px;background:#1b2240;color:var(--gold);border-radius:999px;padding:6px 14px;font-weight:900;font-size:15px}
.item .price{font-family:'Lilita One',cursive;font-size:52px;color:#b5303a;margin-top:6px;line-height:1}
.item .src{font-size:12px;color:#6a7090;margin-top:6px}
.prog{display:flex;gap:6px;justify-content:center}
.prog i{width:34px;height:8px;border-radius:4px;background:rgba(255,255,255,.2)}
.prog i.done{background:var(--gold)}.prog i.cur{background:#fff}
.guess{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px}
.guess .who{display:flex;align-items:center;gap:8px;font-weight:900;flex:1;min-width:0}
.guess .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.guess .dot{width:16px;height:16px;border-radius:50%;flex:none}
.guess input{width:130px;font-size:22px;font-weight:900;text-align:right;background:#fff;color:#1b2240;border:0;border-radius:10px;padding:8px 10px}
.guess input:disabled{background:#d8dcea}
.guess .res{font-weight:900;text-align:right;min-width:120px;font-size:15px;line-height:1.2}
.guess.out{opacity:.5}
.big{font-family:'Lilita One',cursive;font-size:24px;font-weight:400;padding:12px 20px;min-height:60px;border-radius:16px;border:0;cursor:pointer}
.lock{background:var(--green);color:#052b16;box-shadow:0 5px 0 #1a7a46}
.reveal{background:var(--gold);color:#2a1d00;box-shadow:0 5px 0 #a8841f}
.next{background:var(--red);color:#fff;box-shadow:0 5px 0 #8e2226}
.big:active{transform:translateY(3px)}
.big:disabled{opacity:.5}
.summary{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}
.summary h2{font-family:'Lilita One',cursive;font-weight:400;margin:0 0 8px;color:var(--gold);font-size:26px}
.summary .row{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08);font-weight:800}
.hint{opacity:.7;font-size:14px}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:20;padding:16px}
.sheet{background:#141c3c;border:1px solid var(--line);border-radius:20px;padding:18px 20px;width:min(980px,100%);max-height:90vh;overflow:auto}
.sheet h2{font-family:'Lilita One',cursive;font-weight:400;margin:0 0 8px;color:var(--gold)}
.sheet h3{margin:16px 0 6px}
.irow{display:grid;grid-template-columns:28px 40px 1fr 110px 110px;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.irow input[type=checkbox]{width:22px;height:22px;accent-color:var(--gold)}
.irow .src{font-size:12px;opacity:.6}
.in{background:rgba(255,255,255,.08);color:var(--cream);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{background:rgba(255,255,255,.08);color:var(--cream);border:2px solid transparent;border-radius:10px;padding:8px 12px;font-weight:800;cursor:pointer}
.opt.on{border-color:var(--gold);background:rgba(245,197,66,.18)}
.addgrid{display:grid;grid-template-columns:70px 1fr 120px 120px auto;gap:8px;align-items:end}
.addgrid label{font-size:13px;font-weight:800;opacity:.8;display:block;margin-bottom:3px}
.toast{position:fixed;left:50%;top:80px;transform:translateX(-50%);background:var(--cream);color:#1b2240;padding:10px 18px;border-radius:12px;font-weight:900;z-index:40;transition:opacity .4s;pointer-events:none}
@media (max-width:1000px){ .wrap{grid-template-columns:1fr;grid-template-rows:1fr auto} .panel{border-left:0;border-top:1px solid var(--line);max-height:48vh} }
</style>
<script data-goatcounter="https://teachwithreach.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <button class="btn hidden" id="hubBtn">🏠 Hub</button>
  <h1>🏔️ Santa <span>Summit</span></h1>
  <span class="pill" id="roundPill"></span>
  <div class="spacer"></div>
  <button class="btn" id="teamsBtn" title="Play as one class or in teams">👥 Class</button>
  <button class="btn" id="sndBtn" title="Sound on/off">🔊</button>
  <button class="btn" id="setBtn">⚙ Items</button>
</header>
<div class="wrap">
  <div class="stagebox"><svg id="scene" viewBox="0 0 1100 720" preserveAspectRatio="xMidYMid meet"></svg></div>
  <aside class="panel" id="panel"></aside>
</div>
<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" style="opacity:0"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search), EMBED = params.has('embed');
function track(name){ try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({path:'event/' + name, title:name, event:true}); } catch(e) {} }
const money = v => '$' + (Math.round(v * 100) / 100).toLocaleString('en-CA', {minimumFractionDigits:v % 1 ? 2 : 0, maximumFractionDigits:2});

/* =====================================================
   ITEMS (Canadian prices before tax, checked November 2026)
   step = how many dollars off counts as one step up the mountain
   tier = 1 cheap, 2 medium, 3 big ticket (each round mixes tiers)
   ===================================================== */
const ITEMS = [
  {id:'stamp',   e:'✉️', n:'One Canada Post stamp',            d:'A single domestic stamp, bought at the post office', p:1.44,    step:0.10, tier:1, src:'Canada Post rates'},
  {id:'stamp27', e:'📮', n:'A stamp in 2027',                  d:'The federal budget’s planned new price for a single stamp', p:2.00, step:0.10, tier:1, src:'Federal Budget 2026'},
  {id:'ttc',     e:'🚇', n:'One TTC ride',                     d:'Adult fare in Toronto, paid with PRESTO or a card', p:3.30,    step:0.25, tier:1, src:'TTC fares page'},
  {id:'bigmac',  e:'🍔', n:'A Big Mac',                        d:'Average Canadian price (varies by restaurant)',   p:7.81,    step:0.50, tier:1, src:'The Economist Big Mac Index, Jan 2026'},
  {id:'netads',  e:'📺', n:'Netflix with ads, one month',      d:'Standard with Ads plan in Canada',               p:7.99,    step:1,    tier:1, src:'Netflix Canada'},
  {id:'netstd',  e:'🍿', n:'Netflix with no ads, one month',   d:'Standard plan in Canada',                        p:18.99,   step:1,    tier:1, src:'Netflix Canada'},
  {id:'spotify', e:'🎧', n:'Spotify Premium, one month',       d:'Individual plan in Canada',                      p:13.99,   step:1,    tier:1, src:'Spotify Canada'},
  {id:'spotstu', e:'🎓', n:'Spotify Student, one month',       d:'Premium Student plan in Canada',                 p:6.39,    step:0.50, tier:1, src:'Spotify Canada'},
  {id:'minwage', e:'⏱️', n:'One hour of work at minimum wage', d:'Ontario general minimum wage (from Oct 1, 2026)', p:17.95,   step:0.50, tier:1, src:'Ontario.ca'},
  {id:'stuwage', e:'🧑‍🍳', n:'Ontario student minimum wage',  d:'Per hour, for students under 18 (from Oct 1, 2026)', p:16.90, step:0.50, tier:1, src:'Ontario.ca'},
  {id:'stanley', e:'🥤', n:'Stanley Quencher, 40 oz',          d:'H2.0 FlowState tumbler, regular price',          p:59.00,   step:2,    tier:2, src:'Stanley 1913 Canada'},
  {id:'passport',e:'🛂', n:'A 10-year Canadian passport',      d:'Adult passport, applying in Canada',             p:163.50,  step:5,    tier:2, src:'Government of Canada (IRCC)'},
  {id:'airpods', e:'🎶', n:'AirPods 5',                        d:'Apple’s newest regular AirPods, Apple.ca price', p:179.00,  step:5,    tier:2, src:'Apple Canada pricing, Sept 2026'},
  {id:'portal',  e:'🎮', n:'PlayStation Portal',               d:'Sony’s handheld remote player',                  p:319.99,  step:10,   tier:2, src:'Sony recommended price, Apr 2026'},
  {id:'xwing',   e:'🛸', n:'LEGO Star Wars X-Wing (UCS)',      d:'Ultimate Collector Series set 75355',            p:319.99,  step:10,   tier:2, src:'LEGO.com Canada'},
  {id:'switch2', e:'🕹️', n:'Nintendo Switch 2',               d:'The console on its own',                         p:679.99,  step:25,   tier:3, src:'Nintendo, price from Sept 1, 2026'},
  {id:'ps5',     e:'💿', n:'PlayStation 5 (with disc drive)',  d:'Sony recommended price',                         p:819.99,  step:25,   tier:3, src:'Sony, price from Apr 2, 2026'},
  {id:'ps5pro',  e:'⚡', n:'PlayStation 5 Pro',                d:'Sony recommended price',                         p:1099.99, step:25,   tier:3, src:'Sony, price from Apr 2, 2026'},
  {id:'falcon',  e:'🚀', n:'LEGO Millennium Falcon (UCS)',     d:'7,541-piece Star Wars set 75192',                p:1049.99, step:25,   tier:3, src:'LEGO.com Canada'},
  {id:'iphone',  e:'📱', n:'iPhone 17',                        d:'Starting price, Apple.ca',                       p:1299.00, step:25,   tier:3, src:'Apple Canada pricing, Sept 2026'},
  {id:'corolla', e:'🚗', n:'A brand-new Toyota Corolla',       d:'2026 Corolla L, starting MSRP (before fees)',    p:24520,   step:500,  tier:3, src:'Toyota Canada'},
];
const TEAMS = [
  {name:'Team Santa',   col:'#d64045', who:'santa'},
  {name:'Team Elf',     col:'#2fbf71', who:'elf'},
  {name:'Team Snowman', col:'#7fc8ff', who:'snowman'},
  {name:'Team Rudolph', col:'#c47a3c', who:'deer'},
];

/* =====================================================
   SAVE
   ===================================================== */
const KEY = 'twr-summit-v1';
let store; try { store = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
store = Object.assign({custom:[], off:{}, height:25, sound:true, classes:{}}, store || {});
let classId = 'default';
try { const hub = JSON.parse(localStorage.getItem('twr-hub-v1')); if (hub && hub.classes && hub.classes.length){ const w = params.get('class') || hub.current; classId = (hub.classes.find(c => c.id === w) || hub.classes[0]).id; } } catch(e) {}
const CL = store.classes[classId] = Object.assign({teams:1, used:[], wins:[0, 0, 0, 0], names:TEAMS.map(t => t.name)}, store.classes[classId] || {});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };
const allItems = () => [...ITEMS, ...store.custom].filter(i => !store.off[i.id]);

/* =====================================================
   ROUND STATE
   ===================================================== */
let R = null;  // {items:[3], i, phase:'guess'|'locked'|'revealed'|'climbing'|'done'|'end', climbers:[{steps, out, guess}]}
function pickRound(){
  const pool = allItems(), used = new Set(CL.used);
  let fresh = pool.filter(i => !used.has(i.id));
  if (fresh.length < 3){ CL.used = []; fresh = pool; }
  const byTier = t => fresh.filter(i => (i.tier || 2) === t).sort(() => Math.random() - .5);
  const picks = [];
  [1, 2, 3].forEach(t => { const x = byTier(t)[0]; if (x) picks.push(x); });
  const rest = fresh.filter(i => !picks.includes(i)).sort(() => Math.random() - .5);
  while (picks.length < 3 && rest.length) picks.push(rest.shift());
  picks.sort((a, b) => (a.tier || 2) - (b.tier || 2));
  CL.used.push(...picks.map(i => i.id)); save();
  return picks;
}
function newRound(){
  const n = CL.teams;
  R = {items:pickRound(), i:0, phase:'guess', climbers:Array.from({length:n}, () => ({steps:0, out:false, guesses:[]}))};
  buildClimbers(); renderPanel(); renderRound();
}
const H = () => store.height;

/* =====================================================
   SVG SCENE
   ===================================================== */
const SVGNS = 'http://www.w3.org/2000/svg';
const scene = $('#scene');
// staircase geometry: step k (0..H) has a standing point
const BASE = {x:120, y:640}, TOPP = {x:760, y:150};
const stepPt = k => ({x:BASE.x + (TOPP.x - BASE.x) * k / H(), y:BASE.y + (TOPP.y - BASE.y) * k / H()});
const CLIFF = {x:820, y:150}, LAND = {x:975, y:655};
function drawScene(){
  const h = H();
  let stairs = '';
  for (let k = 0; k < h; k++){
    const a = stepPt(k), b = stepPt(k + 1);
    stairs += `<path d="M${a.x - 12} ${a.y} L${a.x - 12} ${b.y} L${b.x - 12} ${b.y}" fill="none" stroke="#7d8fb3" stroke-width="5" stroke-linejoin="round"/>`;
  }
  let marks = '';
  for (let k = 5; k <= h; k += 5){ const p = stepPt(k); marks += `<g transform="translate(${p.x - 58} ${p.y - 6})"><rect x="-22" y="-16" width="44" height="28" rx="8" fill="${k === h ? '#d64045' : '#1b2240'}"/><text x="0" y="5" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="18" fill="#fff">${k}</text></g>`; }
  let stars = '';
  for (let i = 0; i < 60; i++){ stars += `<circle cx="${(i * 197) % 1100}" cy="${(i * 89) % 300}" r="${(i % 3) * .6 + .6}" fill="#fff" opacity="${.3 + (i % 5) * .12}"/>`; }
  scene.innerHTML = `
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b1f4e"/><stop offset=".6" stop-color="#5a4a8a"/><stop offset="1" stop-color="#c98fb0"/></linearGradient>
    <linearGradient id="mtn" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c9d6ee"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fb0d6"/><stop offset="1" stop-color="#6f7fa8"/></linearGradient>
  </defs>
  <rect width="1100" height="720" fill="url(#sky)"/>${stars}
  <circle cx="960" cy="90" r="38" fill="#fff6d8" opacity=".9"/>
  <path d="M-20 720 L180 380 L300 470 L470 260 L560 330 L700 120 L820 150 L820 720 Z" fill="#8193c0" opacity=".45"/>
  <path d="M0 720 L0 660 L${BASE.x - 30} 640 L${TOPP.x - 40} 150 L${CLIFF.x} 150 L${CLIFF.x + 10} 180 L${CLIFF.x - 6} 260 L${CLIFF.x + 8} 360 L${CLIFF.x - 4} 470 L${CLIFF.x + 12} 600 L${CLIFF.x + 4} 720 Z" fill="url(#mtn)" stroke="#aebbe0" stroke-width="3"/>
  <path d="M${CLIFF.x} 150 L${CLIFF.x + 10} 180 L${CLIFF.x - 6} 260 L${CLIFF.x + 8} 360 L${CLIFF.x - 4} 470 L${CLIFF.x + 12} 600 L${CLIFF.x + 4} 720 L${CLIFF.x - 40} 720 L${CLIFF.x - 30} 300 Z" fill="url(#shade)" opacity=".5"/>
  ${stairs}${marks}
  <g transform="translate(${CLIFF.x - 18} 112)"><rect x="-3" y="0" width="6" height="40" fill="#5a3420"/><rect x="-46" y="-26" width="92" height="30" rx="6" fill="#f5c542" stroke="#5a3420" stroke-width="3"/><text x="0" y="-6" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="17" fill="#5a3420">⚠ CLIFF</text></g>
  <path d="M870 720 Q930 640 990 660 Q1050 640 1100 690 L1100 720 Z" fill="#fff"/>
  <ellipse cx="${LAND.x}" cy="${LAND.y + 14}" rx="70" ry="16" fill="#e3ecfb"/>
  <text x="${LAND.x}" y="712" text-anchor="middle" font-family="Nunito, sans-serif" font-weight="900" font-size="15" fill="#6f7fa8">snowbank</text>
  <path d="M0 690 Q120 650 260 680 Q360 700 470 672 L470 720 L0 720 Z" fill="#fff"/>
  ${pine(60, 640, 1)}${pine(30, 660, .8)}${pine(950, 600, .9)}${pine(1060, 620, 1.1)}
  <g id="climbers"></g>
  <g id="fx"></g>`;
}
function pine(x, y, s){ return `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-5" y="0" width="10" height="16" fill="#5a3420"/><path d="M0 -70 L28 -20 L14 -20 L34 8 L-34 8 L-14 -20 L-28 -20Z" fill="#1f6b3d"/><path d="M0 -70 L10 -52 L-10 -52Z" fill="#fff"/></g>`; }
function charSVG(who, col){
  if (who === 'santa') return `<ellipse cx="0" cy="-22" rx="17" ry="20" fill="#d64045"/><rect x="-17" y="-24" width="34" height="5" fill="#222"/><circle cx="0" cy="-48" r="12" fill="#f2c7a5"/><path d="M-12 -46 Q0 -28 12 -46 Q8 -36 0 -34 Q-8 -36 -12 -46Z" fill="#fff"/><path d="M-12 -54 L0 -78 L14 -56Z" fill="#d64045"/><circle cx="15" cy="-72" r="5" fill="#fff"/><rect x="-13" y="-58" width="26" height="6" rx="3" fill="#fff"/><circle cx="-4" cy="-49" r="1.8" fill="#222"/><circle cx="4" cy="-49" r="1.8" fill="#222"/><rect x="-12" y="-4" width="9" height="6" fill="#222"/><rect x="3" y="-4" width="9" height="6" fill="#222"/>`;
  if (who === 'elf') return `<rect x="-13" y="-38" width="26" height="34" rx="10" fill="#2fbf71"/><rect x="-13" y="-22" width="26" height="4" fill="#7a4a1e"/><circle cx="0" cy="-48" r="11" fill="#f2c7a5"/><path d="M-11 -52 Q0 -60 11 -52 L-2 -82 Z" fill="#d64045"/><circle cx="-2" cy="-83" r="4" fill="#f5c542"/><path d="M-11 -48 L-17 -54 L-10 -44Z M11 -48 L17 -54 L10 -44Z" fill="#f2c7a5"/><circle cx="-4" cy="-48" r="1.8" fill="#222"/><circle cx="4" cy="-48" r="1.8" fill="#222"/><rect x="-11" y="-4" width="8" height="6" rx="2" fill="#7a4a1e"/><rect x="3" y="-4" width="8" height="6" rx="2" fill="#7a4a1e"/>`;
  if (who === 'snowman') return `<circle cx="0" cy="-16" r="16" fill="#fff" stroke="#bcd" stroke-width="2"/><circle cx="0" cy="-44" r="12" fill="#fff" stroke="#bcd" stroke-width="2"/><rect x="-10" y="-64" width="20" height="12" fill="#222"/><rect x="-14" y="-54" width="28" height="4" fill="#222"/><path d="M0 -44 L13 -42 L0 -40Z" fill="#f8961e"/><circle cx="-4" cy="-47" r="1.8" fill="#222"/><circle cx="4" cy="-47" r="1.8" fill="#222"/><path d="M-12 -33 L12 -33 L10 -28 L-10 -28Z" fill="${col}"/><circle cx="0" cy="-18" r="2" fill="#222"/><circle cx="0" cy="-10" r="2" fill="#222"/>`;
  return `<ellipse cx="0" cy="-22" rx="18" ry="15" fill="#a0612f"/><rect x="-14" y="-12" width="6" height="14" fill="#7a4a1e"/><rect x="8" y="-12" width="6" height="14" fill="#7a4a1e"/><ellipse cx="8" cy="-44" rx="11" ry="12" fill="#a0612f"/><path d="M2 -54 L-6 -72 M-2 -64 L-12 -66 M12 -54 L18 -74 M16 -66 L26 -68" stroke="#5a3420" stroke-width="3" stroke-linecap="round"/><circle cx="19" cy="-41" r="5" fill="#ff3b3b"/><circle cx="6" cy="-47" r="1.8" fill="#222"/>`;
}
let actors = [];
function buildClimbers(){
  drawScene();
  const g = scene.querySelector('#climbers');
  actors = R.climbers.map((c, i) => {
    const t = TEAMS[i];
    const el = document.createElementNS(SVGNS, 'g');
    el.innerHTML = `<g class="body">${charSVG(t.who, t.col)}</g><g transform="translate(0 -96)"><rect x="-22" y="-13" width="44" height="22" rx="8" fill="${t.col}" stroke="#fff" stroke-width="2"/><text class="cnt" x="0" y="4" text-anchor="middle" font-family="Lilita One, sans-serif" font-size="15" fill="#fff">0</text></g>`;
    g.appendChild(el);
    const a = {el, i, x:0, y:0, rot:0, scale:1.3};
    place(a, 0); return a;
  });
  // back-to-front so front climbers are drawn last
  actors.slice().reverse().forEach(a => g.appendChild(a.el));
}
const laneOff = i => ({x:-i * 20, y:i * 11});
function place(a, k){ const p = stepPt(k), o = laneOff(a.i); a.x = p.x + o.x; a.y = p.y + o.y; draw(a); }
function draw(a){ a.el.setAttribute('transform', `translate(${a.x} ${a.y}) rotate(${a.rot}) scale(${a.scale})`); }
function setCount(a, n){ a.el.querySelector('.cnt').textContent = n > H() ? '💥' : n; }

/* tween helper (rAF, safe on SVG everywhere) */
function tween(ms, fn){ return new Promise(res => { const t0 = performance.now(); const f = now => { const p = Math.min(1, (now - t0) / ms); fn(p); if (p < 1) requestAnimationFrame(f); else res(); }; requestAnimationFrame(f); }); }
const wait = ms => new Promise(r => setTimeout(r, ms));
async function hopTo(a, k){
  const s = stepPt(k - 1), e = stepPt(k), o = laneOff(a.i);
  await tween(150, p => { a.x = s.x + o.x + (e.x - s.x) * p; a.y = s.y + o.y + (e.y - s.y) * p - Math.sin(p * Math.PI) * 14; draw(a); });
}
async function fall(a){
  const o = laneOff(a.i), top = stepPt(H());
  // teeter at the edge
  await tween(300, p => { a.x = top.x + o.x + (CLIFF.x - 10 - top.x) * p; a.y = top.y + o.y; draw(a); });
  for (let w = 0; w < 3; w++){ await tween(140, p => { a.rot = Math.sin(p * Math.PI) * (w % 2 ? -18 : 18); draw(a); }); }
  sfx.fall();
  const sx = a.x, sy = a.y, ex = LAND.x + o.x * .6 - 10, ey = LAND.y + o.y * .3;
  await tween(1100, p => { a.x = sx + (ex - sx) * p; a.y = sy + (ey - sy) * p * p - Math.sin(p * Math.PI) * 60; a.rot = p * 450; draw(a); });
  a.rot = 90; draw(a); sfx.thud(); puff(ex, ey);
}
function puff(x, y){
  const fx = scene.querySelector('#fx');
  for (let i = 0; i < 14; i++){
    const c = document.createElementNS(SVGNS, 'circle'); c.setAttribute('r', 8 + Math.random() * 8); c.setAttribute('fill', '#fff'); fx.appendChild(c);
    const dx = (Math.random() - .5) * 140, dy = -20 - Math.random() * 60;
    tween(700, p => { c.setAttribute('cx', x + dx * p); c.setAttribute('cy', y + dy * p + 40 * p * p); c.setAttribute('opacity', 1 - p); }).then(() => c.remove());
  }
}

/* =====================================================
   SOUND
   ===================================================== */
let AC = null;
function tone(f, t0, dur, type = 'sine', vol = .12, f2){
  if (!store.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05);
  } catch(e) {}
}
const sfx = {
  step:k => { tone(330 + k * 22, 0, .12, 'triangle', .1); tone((330 + k * 22) * 2, 0, .06, 'sine', .03); },
  fall:() => tone(900, 0, 1.1, 'sine', .14, 120),
  thud:() => { tone(90, 0, .3, 'sine', .3); tone(60, .02, .4, 'triangle', .2); },
  tick:() => tone(1200, 0, .03, 'square', .03),
  ding:() => [784, 988, 1175].forEach((f, i) => tone(f, i * .12, .35, 'triangle', .12)),
  win:() => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i * .14, .4, 'triangle', .12)),
  bull:() => [1047, 1319, 1568, 2093].forEach((f, i) => tone(f, i * .08, .3, 'sine', .1)),
};

/* =====================================================
   PANEL
   ===================================================== */
function renderRound(){ $('#roundPill').textContent = R.phase === 'end' ? 'Round over' : `Item ${R.i + 1} of 3 · ${H()} steps to the cliff`; }
function renderPanel(){
  const it = R.items[R.i], ph = R.phase;
  const prog = `<div class="prog">${R.items.map((_, k) => `<i class="${k < R.i || (k === R.i && ph === 'done') ? 'done' : k === R.i ? 'cur' : ''}"></i>`).join('')}</div>`;
  if (ph === 'end'){ renderEnd(prog); return; }
  const showPrice = ['revealed', 'climbing', 'done'].includes(ph);
  let h = `${prog}<div class="item"><div class="em">${it.e}</div><div class="nm">${esc(it.n)}</div><div class="dt">${esc(it.d || '')}</div>
    <div class="price" id="priceOut">${showPrice ? money(it.p) : '$ ? ? ?'}</div>
    <div class="rule">⚠ Every ${money(it.step)} off = 1 step</div>
    ${showPrice && it.src ? `<div class="src">Price: ${esc(it.src)}</div>` : ''}</div>`;
  h += R.climbers.map((c, i) => {
    const t = TEAMS[i], g = c.guesses[R.i];
    let res = '';
    if (showPrice && g != null && !c.out){ const off = Math.abs(g - it.p), st = Math.round(off / it.step); res = off === 0 ? '🎯 Exact!' : `Off ${money(off)}<br>+${st} step${st === 1 ? '' : 's'}`; }
    if (c.out) res = '💥 Fell off!';
    return `<div class="guess${c.out ? ' out' : ''}"><div class="who"><i class="dot" style="background:${t.col}"></i><span>${esc(CL.teams > 1 ? CL.names[i] : 'Your class')}</span></div>
      ${showPrice || c.out ? `<div class="res">${g != null && !c.out ? `<span class="hint">guessed ${money(g)}</span><br>` : ''}${res}</div>` : `<input type="number" inputmode="decimal" min="0" step="any" data-g="${i}" placeholder="$" value="${g != null ? g : ''}" ${ph !== 'guess' || c.out ? 'disabled' : ''} aria-label="Guess for ${esc(t.name)}">`}</div>`;
  }).join('');
  if (ph === 'guess') h += `<button class="big lock" id="lockBtn">🔒 Lock in ${CL.teams > 1 ? 'guesses' : 'guess'}</button>`;
  if (ph === 'locked') h += `<button class="big reveal" id="revealBtn">🎁 Reveal the price</button>`;
  if (ph === 'climbing') h += `<button class="big reveal" disabled>🧗 Climbing…</button>`;
  if (ph === 'done') h += `<button class="big next" id="nextBtn">${R.i < 2 && R.climbers.some(c => !c.out) ? '▶ Next item' : '🏁 See who survived'}</button>`;
  $('#panel').innerHTML = h;
  $('#panel').querySelectorAll('[data-g]').forEach(inp => { inp.oninput = () => { const v = parseFloat(inp.value); R.climbers[+inp.dataset.g].guesses[R.i] = isNaN(v) ? null : v; }; inp.onkeydown = e => { if (e.key === 'Enter') lock(); }; });
  const lb = $('#lockBtn'); if (lb) lb.onclick = lock;
  const rb = $('#revealBtn'); if (rb) rb.onclick = reveal;
  const nb = $('#nextBtn'); if (nb) nb.onclick = nextItem;
  const first = $('#panel [data-g]:not(:disabled)'); if (first && ph === 'guess') setTimeout(() => first.focus(), 50);
}
function lock(){
  const missing = R.climbers.some(c => !c.out && (c.guesses[R.i] == null));
  if (missing){ toast('Every team needs a guess first'); return; }
  R.phase = 'locked'; renderPanel();
}
async function reveal(){
  const it = R.items[R.i];
  R.phase = 'revealed'; renderPanel();
  // count-up drumroll
  const out = $('#priceOut'); let last = 0;
  await tween(1500, p => { const e = 1 - Math.pow(1 - p, 3), v = it.p * e; out.textContent = money(it.p >= 100 ? Math.round(v) : Math.round(v * 100) / 100); if (p - last > .06){ sfx.tick(); last = p; } });
  out.textContent = money(it.p); sfx.ding();
  await wait(500);
  R.phase = 'climbing'; renderPanel();
  // everyone climbs at the same time
  await Promise.all(R.climbers.map(async (c, i) => {
    if (c.out) return;
    const a = actors[i], g = c.guesses[R.i], add = Math.round(Math.abs(g - it.p) / it.step);
    if (add === 0){ sfx.bull(); toast(`🎯 ${CL.teams > 1 ? CL.names[i] : 'Bullseye'}: exact price!`); return; }
    for (let s = 0; s < add; s++){
      c.steps++;
      if (c.steps > H()){ setCount(a, c.steps); c.out = true; await fall(a); return; }
      await hopTo(a, c.steps); setCount(a, c.steps); if (i === 0) sfx.step(c.steps);
      await wait(70);
    }
  }));
  R.phase = 'done'; renderPanel();
  if (R.climbers.every(c => c.out)) toast('😱 Everyone fell off!');
}
function nextItem(){
  if (R.i < 2 && R.climbers.some(c => !c.out)){ R.i++; R.phase = 'guess'; renderPanel(); renderRound(); return; }
  R.phase = 'end'; renderRound(); renderPanel();
}
function renderEnd(prog){
  const alive = R.climbers.map((c, i) => ({...c, i})).filter(c => !c.out).sort((a, b) => a.steps - b.steps);
  let title, sub;
  if (CL.teams === 1){
    title = alive.length ? '🎉 Santa made it!' : '😵 Santa fell off the cliff!';
    sub = alive.length ? `Finished on step ${alive[0].steps} of ${H()}.` : 'Better luck next round.';
  } else if (!alive.length){ title = '😵 Everyone fell off!'; sub = 'No winner this round.'; }
  else {
    const best = alive[0].steps, winners = alive.filter(c => c.steps === best);
    title = winners.length > 1 ? '🤝 It’s a tie!' : `🏆 ${CL.names[winners[0].i]} wins!`;
    sub = `Fewest steps without falling: ${best}.`;
    if (!R.counted){ winners.forEach(w => CL.wins[w.i]++); save(); }
  }
  if (!R.counted){ R.counted = true; if (alive.length) sfx.win(); track('summit-round'); }
  let rows = R.climbers.map((c, i) => `<div class="row"><span style="color:${TEAMS[i].col}">● ${esc(CL.teams > 1 ? CL.names[i] : 'Your class')}</span><span>${c.out ? '💥 fell off' : `${c.steps} / ${H()} steps`}</span></div>`).join('');
  let wins = CL.teams > 1 ? `<div class="summary"><h2>🏅 Rounds won</h2>${TEAMS.slice(0, CL.teams).map((t, i) => `<div class="row"><span style="color:${t.col}">● ${esc(CL.names[i])}</span><span>${CL.wins[i]}</span></div>`).join('')}<button class="btn" id="resetWins" style="margin-top:10px">🧹 Reset</button></div>` : '';
  let recap = R.items.map(it => `<div class="row"><span>${it.e} ${esc(it.n)}</span><span>${money(it.p)}</span></div>`).join('');
  $('#panel').innerHTML = `${prog}<div class="summary"><h2>${title}</h2><p class="hint" style="margin:0 0 8px;opacity:.9">${sub}</p>${rows}</div>
    <div class="summary"><h2>🧾 The prices</h2>${recap}</div>${wins}
    <button class="big next" id="againBtn">🔁 New round</button>`;
  $('#againBtn').onclick = newRound;
  const rw = $('#resetWins'); if (rw) rw.onclick = () => { CL.wins = [0, 0, 0, 0]; save(); renderPanel(); };
  if (alive.length) confetti();
}

/* =====================================================
   SETTINGS
   ===================================================== */
$('#teamsBtn').onclick = () => {
  if (R && ['climbing', 'revealed'].includes(R.phase)) return;
  CL.teams = CL.teams >= 4 ? 1 : CL.teams + 1; save(); renderTeamsBtn(); newRound();
};
function renderTeamsBtn(){ $('#teamsBtn').textContent = CL.teams === 1 ? '👥 Class' : `👥 ${CL.teams} teams`; $('#teamsBtn').classList.toggle('on', CL.teams > 1); }
$('#sndBtn').onclick = () => { store.sound = !store.sound; save(); $('#sndBtn').textContent = store.sound ? '🔊' : '🔇'; };
$('#setBtn').onclick = openSettings;
function openSettings(){
  const row = it => `<div class="irow"><input type="checkbox" data-on="${it.id}"${store.off[it.id] ? '' : ' checked'}><span style="font-size:26px">${it.e}</span><span><b>${esc(it.n)}</b><br><span class="src">${esc(it.src || 'Your item')}${it.custom ? ' · <a href="#" data-del="' + it.id + '" style="color:#ff9a9a">delete</a>' : ''}</span></span><span>${money(it.p)}</span><span class="hint">${money(it.step)} / step</span></div>`;
  $('#sheet').innerHTML = `<h2>⚙ Items & settings</h2>
    <h3>🏔️ Mountain height</h3>
    <div class="opts" id="hOpts">${[[15, 'Short (15 steps): harder'], [25, 'Classic (25 steps)'], [35, 'Tall (35 steps): easier']].map(([v, l]) => `<button class="opt${store.height === v ? ' on' : ''}" data-h="${v}">${l}</button>`).join('')}</div>
    ${CL.teams > 1 ? `<h3>👥 Team names</h3><div class="opts">${TEAMS.slice(0, CL.teams).map((t, i) => `<input class="in" style="width:200px;border-color:${t.col}" data-name="${i}" value="${esc(CL.names[i])}" maxlength="24">`).join('')}</div>` : ''}
    <h3>➕ Add your own item</h3>
    <p class="hint">The cafeteria cookie, a local favourite, or something from the news. Pick a step size that fits: about 1/20 of the price works well.</p>
    <div class="addgrid">
      <div><label>Emoji</label><input class="in" id="aE" value="🎁" maxlength="4"></div>
      <div><label>Item</label><input class="in" id="aN" placeholder="e.g. Cafeteria cookie" maxlength="50"></div>
      <div><label>Price ($)</label><input class="in" id="aP" type="number" step="any" min="0"></div>
      <div><label>$ per step</label><input class="in" id="aS" type="number" step="any" min="0" placeholder="auto"></div>
      <button class="btn gold" id="aAdd">Add</button>
    </div>
    <h3>🧾 Items (${allItems().length} in play)</h3>
    <p class="hint">Prices are Canadian, before tax, checked November 2026. Untick any you don’t want.</p>
    ${[...ITEMS, ...store.custom.map(c => ({...c, custom:true}))].map(row).join('')}
    <div style="display:flex;justify-content:flex-end;margin-top:14px;gap:8px"><button class="btn" id="resetUsed">🔀 Reshuffle items</button><button class="btn gold" id="closeSet">Done</button></div>`;
  $('#modal').classList.remove('hidden');
  $('#sheet').querySelectorAll('[data-h]').forEach(b => b.onclick = () => { store.height = +b.dataset.h; save(); $('#sheet').querySelectorAll('[data-h]').forEach(x => x.classList.toggle('on', x === b)); store._heightChanged = true; });
  $('#sheet').querySelectorAll('[data-on]').forEach(c => c.onchange = () => { if (c.checked) delete store.off[c.dataset.on]; else store.off[c.dataset.on] = true; save(); });
  $('#sheet').querySelectorAll('[data-name]').forEach(inp => inp.oninput = () => { CL.names[+inp.dataset.name] = inp.value || TEAMS[+inp.dataset.name].name; save(); });
  $('#sheet').querySelectorAll('[data-del]').forEach(a => a.onclick = e => { e.preventDefault(); store.custom = store.custom.filter(c => c.id !== a.dataset.del); save(); openSettings(); });
  $('#aAdd').onclick = () => {
    const n = $('#aN').value.trim(), p = parseFloat($('#aP').value);
    if (!n || !(p > 0)){ toast('Add a name and a price'); return; }
    let s = parseFloat($('#aS').value);
    if (!(s > 0)){ const raw = p / 20, mag = Math.pow(10, Math.floor(Math.log10(raw))); s = [1, 2, 5, 10].map(m => m * mag).find(v => v >= raw) || raw; s = Math.max(.05, Math.round(s * 100) / 100); }
    store.custom.push({id:'c' + Date.now(), e:$('#aE').value || '🎁', n, d:'', p, step:s, tier:p < 30 ? 1 : p < 400 ? 2 : 3, src:'Added by your teacher'});
    save(); openSettings(); toast('Added!');
  };
  $('#resetUsed').onclick = () => { CL.used = []; save(); toast('Items reshuffled'); };
  $('#closeSet').onclick = closeSettings;
}
function closeSettings(){
  $('#modal').classList.add('hidden');
  if (allItems().length < 3){ toast('Keep at least 3 items ticked'); store.off = {}; save(); }
  if (store._heightChanged || (R && R.phase === 'guess' && R.i === 0)){ delete store._heightChanged; save(); newRound(); }
  else renderPanel();
}
$('#modal').onclick = e => { if (e.target.id === 'modal') closeSettings(); };

let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2000); }
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#f5c542', '#d64045', '#2fbf71', '#4aa3ff', '#ff8fc7'];
  for (let i = 0; i < 100; i++){
    const el = document.createElement('div'); el.style.cssText = `position:fixed;width:12px;height:18px;z-index:30;pointer-events:none;border-radius:2px;left:${innerWidth / 2}px;top:${innerHeight * .35}px;background:${colors[i % 5]}`;
    document.body.appendChild(el);
    const dx = (Math.random() - .5) * innerWidth, dy = -100 - Math.random() * 400, r = (Math.random() - .5) * 900;
    try { el.animate([{transform:'translate(0,0)'}, {transform:`translate(${dx}px,${dy}px) rotate(${r}deg)`, offset:.4}, {transform:`translate(${dx * 1.2}px,${dy + 800}px) rotate(${r * 2}deg)`, opacity:0}], {duration:2200, easing:'cubic-bezier(.15,.7,.4,1)'}).onfinish = () => el.remove(); } catch(e) { el.remove(); }
  }
}
if (EMBED){ $('#hubBtn').classList.remove('hidden'); $('#hubBtn').onclick = () => window.parent.postMessage({type:'twr-close'}, '*'); }
$('#sndBtn').textContent = store.sound ? '🔊' : '🔇';
renderTeamsBtn(); newRound();
</script>
</body>
