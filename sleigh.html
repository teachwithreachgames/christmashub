<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Santa's Sleigh Jump | Teach With Reach Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--cream:#fdf6e3;--gold:#f5c542;--red:#d64045;--green:#2fbf71;--panel:rgba(10,24,40,.78);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9cc8ec}
body{font-family:Nunito,system-ui,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none}
button{font:inherit}
.hidden{display:none!important}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.1);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:8px 13px;font-weight:800;cursor:pointer;min-height:44px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.2)}
.btn.on,.btn.gold{background:var(--gold);color:#2a1d00;border-color:transparent}

header{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap;z-index:5;backdrop-filter:blur(6px)}
h1{font-family:'Lilita One',cursive;font-weight:400;margin:0 4px;font-size:clamp(18px,1.9vw,28px);white-space:nowrap}
h1 span{color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{background:transparent;color:var(--cream);border:0;padding:8px 11px;font-weight:800;cursor:pointer;min-height:42px;white-space:nowrap}
.seg button.on{background:var(--gold);color:#2a1d00}
.spacer{flex:1}
.score{font-family:'Lilita One',cursive;font-size:22px;padding:0 6px;white-space:nowrap}

.card{position:fixed;left:14px;top:76px;width:min(380px,calc(100vw - 28px));background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px 16px;z-index:4;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.card h2{font-family:'Lilita One',cursive;font-weight:400;font-size:20px;margin:0 0 6px;color:var(--gold)}
.prompt{font-size:clamp(18px,1.6vw,23px);font-weight:900;line-height:1.3;margin:0 0 8px}
.card svg{width:100%;height:auto;display:block;background:rgba(255,255,255,.95);border-radius:12px;margin:6px 0 10px}
.ans{background:rgba(47,191,113,.18);border:1px solid rgba(47,191,113,.5);border-radius:12px;padding:8px 12px;font-weight:800;margin:0 0 10px;font-size:17px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.tip{font-weight:700;opacity:.9;font-size:16px;line-height:1.4}

.controls{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px 14px;z-index:4;backdrop-filter:blur(6px);box-shadow:0 10px 30px rgba(0,0,0,.3);max-width:calc(100vw - 20px)}
.prot{width:170px;height:96px;flex:none}
.deg{font-family:'Lilita One',cursive;font-size:44px;min-width:110px;text-align:center;line-height:1}
.deg small{display:block;font-family:Nunito;font-size:13px;font-weight:800;opacity:.7}
.adj{display:flex;flex-direction:column;gap:6px;align-items:center}
.adj .row{flex-wrap:nowrap}
input[type=range]{width:min(300px,30vw);accent-color:var(--gold);height:36px}
.sm{min-width:52px;padding:6px 8px}
.launch{font-family:'Lilita One',cursive;font-size:28px;background:var(--red);color:#fff;border:0;border-radius:18px;padding:12px 26px;cursor:pointer;box-shadow:0 6px 0 #8e2226;min-height:64px}
.launch:active{transform:translateY(3px);box-shadow:0 3px 0 #8e2226}
.launch:disabled{opacity:.5;cursor:default}
.size{font-family:'Lilita One',cursive;font-size:22px;min-width:110px;min-height:60px}
.blocks{display:flex;flex-direction:column-reverse;gap:2px;align-items:center;min-width:60px;height:96px;justify-content:flex-start}
.blocks i{width:34px;height:10px;border-radius:2px;display:block}

.banner{position:fixed;left:50%;top:84px;transform:translateX(-50%) scale(.9);background:#fdf6e3;color:#102018;border-radius:18px;padding:12px 24px;font-weight:900;font-size:clamp(20px,2.2vw,30px);z-index:6;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;text-align:center;max-width:min(680px,90vw);box-shadow:0 10px 30px rgba(0,0,0,.35)}
.banner.show{opacity:1;transform:translateX(-50%) scale(1)}
.banner small{display:block;font-size:.6em;font-weight:800;opacity:.75;margin-top:2px}
.fatal{position:fixed;inset:0;display:grid;place-items:center;background:#0b1d2c;color:#fff;font-size:22px;text-align:center;padding:30px;z-index:20}
@media (max-width:1100px){ .card{top:auto;bottom:140px;width:320px} .prot{display:none} }
</style>
<script data-goatcounter="https://teachwithreach.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<canvas id="c"></canvas>

<header>
  <button class="btn hidden" id="hubBtn">🏠 Hub</button>
  <h1>🛷 Santa's <span>Sleigh Jump</span></h1>
  <div class="seg" id="bands">
    <button data-b="k1">K–1</button><button data-b="g23">Gr 2–3</button><button data-b="g4">Gr 4</button><button data-b="g56">Gr 5–6</button><button data-b="g78">Gr 7–8</button>
  </div>
  <div class="seg" id="modes"><button data-m="challenge">🎯 Challenge</button><button data-m="free">🧪 Free play</button></div>
  <div class="spacer"></div>
  <div class="score" title="Presents delivered by this class">🎁 <span id="delivered">0</span></div>
  <button class="btn" id="camBtn" title="Switch camera">🎥 Side</button>
  <button class="btn" id="sndBtn" title="Sound on/off">🔊</button>
</header>

<div class="card" id="card"></div>
<div class="controls" id="controls"></div>
<div class="banner" id="banner"></div>

<script type="module">
import * as THREE from './vendor/three-bundle.min.js';
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const params = new URLSearchParams(location.search), EMBED = params.has('embed');
function track(name){ try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({path:'event/' + name, title:name, event:true}); } catch(e) {} }

/* =====================================================
   SAVE (per class)
   ===================================================== */
const KEY = 'twr-sleigh-v1';
let store; try { store = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
if (!store || !store.classes) store = {classes:{}, sound:true};
let classId = 'default';
try {
  const hub = JSON.parse(localStorage.getItem('twr-hub-v1'));
  if (hub && hub.classes && hub.classes.length){ const want = params.get('class') || hub.current; classId = (hub.classes.find(c => c.id === want) || hub.classes[0]).id; }
} catch(e) {}
const ST = store.classes[classId] = Object.assign({band:'g4', mode:'challenge', delivered:0, hide:false}, store.classes[classId] || {});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };

/* =====================================================
   PHYSICS + GAME RULES
   Angles (Gr 4–8): lip 3 m up, town on a 3 m plateau, so range = v² sin2θ / g.
   Sizes (K–3): 30° ramp, height = blocks, flat ground.
   ===================================================== */
const G = 9.8, V_ANG = 18, LIP = 3, PLAT_X = 4, PAD_R = 1.6;
const SIZE_ANGLE = 30;
const SIZES = {small:2, medium:4, big:7};
const isAngles = () => ['g4', 'g56', 'g78'].includes(ST.band);
const sizeSpeed = b => 8 + 1.2 * b;
function launchInfo(){
  if (isAngles()) return {theta:angle, H:LIP, v:V_ANG};
  return {theta:SIZE_ANGLE, H:blocks, v:sizeSpeed(blocks)};
}
const landY = x => (isAngles() && x >= PLAT_X) ? LIP : 0;
function rangeFor(theta, H, v){
  const r = theta * Math.PI / 180, vs = v * Math.sin(r), vc = v * Math.cos(r);
  if (isAngles()) return v * v * Math.sin(2 * r) / G;          // lands back at lip height
  return vc * (vs + Math.sqrt(vs * vs + 2 * G * H)) / G;        // lands on the ground
}
const rangeAngle = th => rangeFor(th, LIP, V_ANG);
const rangeBlocks = b => rangeFor(SIZE_ANGLE, b, sizeSpeed(b));

let angle = 30, blocks = 4, sizeName = 'medium';

/* =====================================================
   QUESTIONS
   ===================================================== */
const HOUSES = [['red', 0xd64045], ['blue', 0x3d7be0], ['green', 0x2a9d55], ['yellow', 0xe8b923], ['purple', 0x8e5bd6]];
let Q = null, qNum = 0, showAns = false;
function goodAngle(){ return pick([15, 18, 20, 22, 24, 25, 26, 28, 30, 32, 34, 35, 36, 55, 56, 58, 60, 62, 64, 65, 66, 68, 70, 72, 75]); }
function makeQuestion(){
  showAns = false; qNum++;
  const b = ST.band;
  if (b === 'k1'){
    const s = pick(['small', 'medium', 'big']), hc = {small:0, medium:1, big:2}[s];
    return {kind:'size', answer:s, house:hc, text:`Which ramp will get Santa to the <b style="color:${['#ff7a7f','#7fb0ff','#6fe0a0'][hc]}">${HOUSES[hc][0].toUpperCase()}</b> house?`, sub:'Small, medium or big?', expl:`The <b>${s}</b> ramp! ${s === 'big' ? 'The far house needs the biggest ramp.' : s === 'small' ? 'The close house only needs a small ramp.' : 'The middle house needs a medium ramp.'}`};
  }
  if (b === 'g23'){
    const ans = rnd(2, 8), forms = [];
    { const a = rnd(1, ans - 1); forms.push([`${a} + ${ans - a}`, `${a} + ${ans - a} = ${ans}`]); }
    { const a = rnd(ans + 1, ans + 6); forms.push([`${a} − ${a - ans}`, `${a} − ${a - ans} = ${ans}`]); }
    forms.push([`1 more than ${ans - 1}`, `${ans - 1} + 1 = ${ans}`]);
    if (ans <= 6) forms.push([`2 fewer than ${ans + 2}`, `${ans + 2} − 2 = ${ans}`]);
    if (ans % 2 === 0) forms.push([`double ${ans / 2}`, `${ans / 2} + ${ans / 2} = ${ans}`], [`half of ${ans * 2}`, `${ans * 2} ÷ 2 = ${ans}`]);
    if (ans % 2 === 0 && ans > 2) forms.push([`${ans / 2} groups of 2`, `2 + `.repeat(ans / 2 - 1) + `2 = ${ans}`]);
    const [f, e] = pick(forms);
    return {kind:'blocks', answer:ans, house:rnd(0, 4), text:`Build a ramp <b>${f}</b> blocks tall.`, sub:'Count the blocks as you build!', expl:`${e} blocks`};
  }
  if (b === 'g4'){
    const forms = [
      () => { const a = pick([10, 15, 20, 25, 30, 35, 60, 65, 70, 75, 80]); return [a, `Estimate! Set the ramp to <b>${a}°</b>.`, 'The degrees are hidden until you launch.', `${a}°`]; },
      () => [45, 'Set the ramp to <b>half of a right angle</b>.', 'A right angle is 90°.', '90 ÷ 2 = 45°'],
      () => [30, 'Set the ramp to <b>one third of a right angle</b>.', 'A right angle is 90°.', '90 ÷ 3 = 30°'],
      () => [60, 'Set the ramp to <b>two thirds of a right angle</b>.', 'A right angle is 90°.', '90 ÷ 3 × 2 = 60°'],
      () => { const k = pick([15, 20, 25, 30]); return [90 - k, `Set the ramp to <b>a right angle take away ${k}°</b>.`, 'A right angle is 90°.', `90 − ${k} = ${90 - k}°`]; },
      () => { const a = pick([15, 20, 25, 30, 35]); return [a, `Set an <b>acute</b> angle of <b>${a}°</b>, with the numbers hidden.`, 'Acute angles are less than 90°.', `${a}°`]; },
    ];
    const [ans, text, sub, expl] = pick(forms)();
    return {kind:'angle', answer:ans, tol:3, house:rnd(0, 4), text, sub, expl, hideDeg:true};
  }
  const ans = goodAngle(), top = 90 - ans, ext = 180 - ans;
  if (b === 'g56'){
    const forms = [
      () => ({text:`The <b>top angle</b> of the ramp is <b>${top}°</b>. What is the ramp angle?`, d:{ramp:'?', top:top + '°'}, expl:`The two angles add to 90°: 90 − ${top} = ${ans}°`, sub:'The ramp is a right triangle.'}),
      () => ({text:`The angle <b>outside</b> the ramp is <b>${ext}°</b>. What is the ramp angle?`, d:{ramp:'?', ext:ext + '°'}, expl:`Angles on a straight line add to 180°: 180 − ${ext} = ${ans}°`, sub:'The ground is a straight line.'}),
      () => ({text:`The ramp triangle has angles of <b>90°</b> and <b>${top}°</b>. What is the ramp angle?`, d:{ramp:'?', top:top + '°', right:true}, expl:`A triangle's angles add to 180°: 180 − 90 − ${top} = ${ans}°`, sub:'All three angles add to 180°.'}),
    ];
    return Object.assign({kind:'angle', answer:ans, tol:1, house:rnd(0, 4)}, pick(forms)());
  }
  // Gr 7–8: algebra
  const forms = [
    () => { const [a, k] = pick([[30, 2], [18, 4], [15, 5]]); return {answer:a, text:`The top angle is <b>${k} times</b> the ramp angle. Find the ramp angle.`, d:{ramp:'x', top:k + 'x'}, expl:`x + ${k}x = 90, so ${k + 1}x = 90 and x = ${a}°`}; },
    () => { const a = pick([15, 20, 25, 30, 35]), d = 90 - 2 * a; return {answer:a, text:`The top angle is <b>${d}° more</b> than the ramp angle. Find the ramp angle.`, d:{ramp:'x', top:`x + ${d}`}, expl:`x + x + ${d} = 90, so 2x = ${90 - d} and x = ${a}°`}; },
    () => { const [a, k] = pick([[30, 5], [20, 8], [15, 11], [36, 4], [60, 2], [18, 9]]); return {answer:a, text:`The outside angle is <b>${k} times</b> the ramp angle. Find the ramp angle.`, d:{ramp:'x', ext:k + 'x'}, expl:`x + ${k}x = 180, so ${k + 1}x = 180 and x = ${a}°`}; },
    () => { const x = pick([10, 12, 15, 18, 20]), c = 90 - 3 * x, a = 2 * x + c; return {answer:a, text:`The ramp angle is <b>2x + ${c}</b> and the top angle is <b>x</b>. Find x, then set the ramp angle.`, d:{ramp:`2x + ${c}`, top:'x'}, expl:`2x + ${c} + x = 90, so 3x = ${90 - c} and x = ${x}. Ramp = 2(${x}) + ${c} = ${a}°`}; },
  ];
  let q = null; while (!q) q = pick(forms)();
  return Object.assign({kind:'angle', tol:1, house:rnd(0, 4), sub:'The ramp is a right triangle.'}, q);
}
function targetX(){
  if (!Q) return null;
  if (Q.kind === 'angle') return rangeAngle(Q.answer);
  if (Q.kind === 'blocks') return rangeBlocks(Q.answer);
  return rangeBlocks(SIZES[Q.answer]);
}

/* triangle diagram for angle questions */
function diagramSVG(d){
  if (!d) return '';
  const lab = (x, y, t, col = '#c0262d') => `<text x="${x}" y="${y}" font-family="Nunito,Arial" font-weight="900" font-size="22" fill="${col}" text-anchor="middle">${esc(t)}</text>`;
  return `<svg viewBox="0 0 360 170">
    <line x1="10" y1="140" x2="350" y2="140" stroke="#888" stroke-width="3"/>
    <polygon points="90,140 300,140 300,30" fill="#f4e2c4" stroke="#7a4a1e" stroke-width="4" stroke-linejoin="round"/>
    <line x1="90" y1="140" x2="300" y2="30" stroke="#b5303a" stroke-width="7" stroke-linecap="round"/>
    <path d="M286 140 L286 126 L300 126" fill="none" stroke="#333" stroke-width="2.5"/>
    <path d="M140 140 A50 50 0 0 0 134.3 117" fill="none" stroke="#c0262d" stroke-width="3"/>
    ${lab(170, 130, d.ramp)}
    ${d.top ? `<path d="M300 62 A32 32 0 0 1 271.6 45" fill="none" stroke="#2167c4" stroke-width="3"/>${lab(272, 84, d.top, '#2167c4')}` : ''}
    ${d.ext ? `<path d="M50 140 A40 40 0 0 1 125.4 121.4" fill="none" stroke="#1f8a4c" stroke-width="3"/>${lab(62, 116, d.ext, '#1f8a4c')}` : ''}
    ${d.right ? lab(320, 132, '90°', '#333') : ''}
    <text x="200" y="164" font-family="Nunito,Arial" font-weight="800" font-size="13" fill="#666" text-anchor="middle">ground</text>
    <text x="190" y="70" font-family="Nunito,Arial" font-weight="800" font-size="13" fill="#b5303a" transform="rotate(-27 190 70)" text-anchor="middle">ramp</text>
  </svg>`;
}

/* =====================================================
   THREE.JS SCENE
   ===================================================== */
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas:$('#c'), antialias:true}); }
catch(e){ document.body.insertAdjacentHTML('beforeend', '<div class="fatal">This computer\'s browser can\'t show 3D graphics (WebGL is off).<br>Try Chrome or Edge, or another computer.</div>'); throw e; }
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa9d4f5);
scene.fog = new THREE.Fog(0xcfe6f8, 90, 220);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 600);
scene.add(new THREE.HemisphereLight(0xeaf4ff, 0x9fb3c8, 1.9));
const sun = new THREE.DirectionalLight(0xfff4e0, 2.4);
sun.position.set(-30, 60, 40); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, {left:-90, right:90, top:50, bottom:-50, near:1, far:200});
scene.add(sun); scene.add(sun.target); sun.target.position.set(0, 0, 0);

const M = (color, o = {}) => new THREE.MeshStandardMaterial(Object.assign({color, roughness:.85}, o));
const SNOW = M(0xf6f9ff, {roughness:.95}), WOOD = M(0xb07a45), DARKWOOD = M(0x7a4a1e);
function mesh(geo, mat, x = 0, y = 0, z = 0, shadow = true){ const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); if (shadow){ m.castShadow = true; m.receiveShadow = true; } return m; }
function textSprite(text, {size = 64, color = '#102018', bg = 'rgba(253,246,227,.95)', scale = 1.6} = {}){
  const c = document.createElement('canvas'), ctx = c.getContext('2d');
  ctx.font = `900 ${size}px Nunito, Arial`;
  const w = Math.ceil(ctx.measureText(text).width) + size * .8, h = Math.ceil(size * 1.45);
  c.width = w; c.height = h;
  ctx.font = `900 ${size}px Nunito, Arial`;
  if (bg){ ctx.fillStyle = bg; const r = h * .3; ctx.beginPath(); ctx.roundRect(0, 0, w, h, r); ctx.fill(); }
  ctx.fillStyle = color; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(text, w / 2, h / 2 + 2);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({map:tex, depthTest:false}));
  s.scale.set(scale * w / h, scale, 1); s.renderOrder = 10;
  return s;
}

/* ground + hill */
{ const g = mesh(new THREE.PlaneGeometry(600, 400), SNOW); g.rotation.x = -Math.PI / 2; scene.add(g); }
const HILL_TOP = 22, HILL_A = -78, HILL_B = -40, START_X = -74;
const hillY = x => x <= HILL_A ? HILL_TOP : x >= HILL_B ? 0 : HILL_TOP * (1 + Math.cos(Math.PI * (x - HILL_A) / (HILL_B - HILL_A))) / 2;
{
  const s = new THREE.Shape(); s.moveTo(-140, -1); s.lineTo(-140, HILL_TOP);
  for (let x = HILL_A; x <= HILL_B + 4; x += 1.5) s.lineTo(x, hillY(x));
  s.lineTo(HILL_B + 4, -1); s.lineTo(-140, -1);
  const g = new THREE.ExtrudeGeometry(s, {depth:60, bevelEnabled:false}); g.translate(0, 0, -30);
  scene.add(mesh(g, SNOW));
  // sled track on the hill
  const pts = []; for (let x = -100; x <= HILL_B; x += 1) pts.push(new THREE.Vector3(x, hillY(x) + .03, 0));
  const track = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 120, .12, 4), M(0xc9d8ea));
  [-0.55, 0.55].forEach(z => { const t = track.clone(); t.position.z = z; scene.add(t); });
}

/* plateau (angles mode only) */
const plateau = new THREE.Group(); scene.add(plateau);
plateau.add(mesh(new THREE.BoxGeometry(160, LIP, 120), SNOW, PLAT_X + 80, LIP / 2, 0));
{ const ice = mesh(new THREE.PlaneGeometry(PLAT_X, 30), M(0xbfe3f7, {roughness:.2, metalness:.1}), PLAT_X / 2, .02, 0); ice.rotation.x = -Math.PI / 2; plateau.add(ice); }

/* trees */
function tree(x, z, s = 1){
  const g = new THREE.Group(); g.position.set(x, 0, z); g.scale.setScalar(s);
  g.add(mesh(new THREE.CylinderGeometry(.35, .45, 1.6), DARKWOOD, 0, .8, 0));
  [[2.4, 3, 2.4], [1.9, 2.6, 3.9], [1.3, 2.2, 5.2]].forEach(([r, h, y]) => g.add(mesh(new THREE.ConeGeometry(r, h, 9), M(0x1f6b3d), 0, y, 0)));
  g.add(mesh(new THREE.ConeGeometry(1.0, .9, 9), SNOW, 0, 6.1, 0));
  return g;
}
const scenery = new THREE.Group(); scene.add(scenery);
for (let i = 0; i < 70; i++){
  const x = -130 + Math.random() * 260, z = -14 - Math.random() * 55;   // trees stay behind the action so the camera view is clear
  const t = tree(x, z, .8 + Math.random() * .8); t.userData.baseX = x; scenery.add(t);
}

/* houses */
function house(color){
  const g = new THREE.Group();
  g.add(mesh(new THREE.BoxGeometry(5, 3.6, 4.4), M(color), 0, 1.8, 0));
  const roof = mesh(new THREE.ConeGeometry(4.1, 2.4, 4), M(0x5a3420), 0, 4.8, 0); roof.rotation.y = Math.PI / 4; roof.scale.set(1, 1, .9); g.add(roof);
  g.add(mesh(new THREE.ConeGeometry(4.25, .5, 4), SNOW, 0, 4.0, 0)).rotation.y = Math.PI / 4;

let AC = null;
function tone(f, t0, dur, type = 'sine', vol = .15){

    const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0;
    o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05);
  } catch(e) {}
}

/* =====================================================
   GAME LOOP
   ===================================================== */
let phase = 'idle', t0 = 0, flight = null, landing = null, revealDeg = false, camMode = 'side';
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
function parkSleigh(){
  phase = 'idle';
  sleigh.position.set(START_X, hillY(START_X), 0);
  sleigh.rotation.z = -Math.atan(slopeAt(START_X));
}
const slopeAt = x => (trackY(x + .3) - trackY(x - .3)) / .6;

function launch(){
  if (phase !== 'idle' && phase !== 'done') return;
  revealDeg = false; buildRamp();
  phase = 'ride'; t0 = performance.now(); trailPts = []; landing = null; whoosh();
  hideBanner(); $('#launchBtn').disabled = true;
  track('sleigh-launch');
}
function resultFor(x){
  const info = launchInfo();
  const label = isAngles() ? info.theta + '°' : ST.band === 'k1' ? sizeName : `${info.H} block${info.H === 1 ? '' : 's'}`;
  let good = false, title, sub = '';
  const tx = ST.mode === 'challenge' ? targetX() : null;
  const dist = x.toFixed(1);
  if (ST.mode === 'free'){
    if (ST.band === 'k1'){
      const hit = Object.entries(SIZES).map(([s, b], i) => [i, Math.abs(rangeBlocks(b) - x)]).find(([, d]) => d <= PAD_R);
      good = !!hit; title = good ? `🎁 Delivered to the ${HOUSES[hit[0]][0]} house!` : `Landed at ${dist} m`;
    } else { title = `Landed at <b>${dist} m</b>`; sub = isAngles() ? `Ramp angle ${info.theta}°` : `Ramp ${info.H} blocks tall`; }
    return {good, title, sub, label};
  }
  const onPad = Math.abs(x - tx) <= PAD_R;
  const right = Q.kind === 'angle' ? Math.abs(info.theta - Q.answer) <= Q.tol : Q.kind === 'blocks' ? info.H === Q.answer : sizeName === Q.answer;
  const comp = Q.kind === 'angle' && !right && onPad && Math.abs(info.theta - (90 - Q.answer)) <= Q.tol;
  if (onPad && right){ good = true; title = '🎁 Delivered! Great math!'; sub = `${label} was exactly right.`; }
  else if (comp){ title = '🤯 It landed, but that\'s not the ramp angle!'; sub = `${info.theta}° and ${Q.answer}° add up to 90°. Complementary angles jump the same distance! Try ${Q.answer}°.`; }
  else if (onPad){ good = true; title = '🎁 Delivered!'; sub = `Close enough to land, but check the math: the answer is ${Q.kind === 'angle' ? Q.answer + '°' : Q.answer}.`; }
  else {
    const off = Math.abs(x - tx).toFixed(1);
    title = x < tx ? `Too short by ${off} m` : `Too far by ${off} m`;
    sub = Q.kind === 'size' ? (x < tx ? 'Try a bigger ramp!' : 'Try a smaller ramp!') : Q.kind === 'blocks' ? (x < tx ? 'Try more blocks!' : 'Try fewer blocks!') : 'Check your math and try again!';
  }
  return {good, title, sub, label};
}
function land(x, y){
  thud(); puff(x, y);
  const res = resultFor(x);
  addTrail(res.label + (isAngles() || ST.band !== 'k1' ? '' : ''), x, y, res.good);
  if (res.good){
    ST.delivered++; save(); $('#delivered').textContent = ST.delivered;
    setTimeout(jingle, 250); confetti(); track('sleigh-delivered');
    if (ST.mode === 'challenge'){ showAns = true; renderCard(); }
  }
  revealDeg = true; buildRamp();
  showBanner(res.title, res.sub);
}

let last = performance.now();
function frame(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  const info = launchInfo();
  if (phase === 'ride'){
    const T = 2.6, p = Math.min(1, (now - t0) / 1000 / T);
    const x = START_X + (0 - START_X) * (p * p * .55 + p * .45);
    sleigh.position.set(x, trackY(x), 0);
    sleigh.rotation.z = Math.atan(slopeAt(x));
    if (p >= 1){
      const r = info.theta * Math.PI / 180;
      flight = {t:0, vx:info.v * Math.cos(r), vy:info.v * Math.sin(r), x:0, y:info.H, prevY:info.H};
      phase = 'fly'; trailPts = [new THREE.Vector3(0, info.H + .3, 0)];
    }
  } else if (phase === 'fly'){
    const f = flight; f.t += dt;
    const x = f.vx * f.t, y = info.H + f.vy * f.t - G * f.t * f.t / 2, vy = f.vy - G * f.t;
    const ground = landY(x);
    let hitWall = isAngles() && x >= PLAT_X && f.x < PLAT_X && y < LIP;
    if ((vy < 0 && y <= ground) || hitWall){
      // solve exact touchdown
      let lx = x, ly = ground;
      if (!hitWall){
        const disc = f.vy * f.vy + 2 * G * (info.H - ground), tl = (f.vy + Math.sqrt(Math.max(0, disc))) / G;
        lx = f.vx * tl;
      } else lx = PLAT_X - .4;
      sleigh.position.set(lx, landY(lx), 0); sleigh.rotation.z = 0;
      trailPts.push(new THREE.Vector3(lx, landY(lx) + .3, 0));
      phase = 'slide'; landing = {x:lx, v:Math.min(f.vx * .5, 8)};
      land(lx, landY(lx));
    } else {
      f.x = x; f.y = y;
      sleigh.position.set(x, y, 0);
      sleigh.rotation.z = Math.atan2(vy, f.vx) * .8;
      if (!trailPts.length || trailPts[trailPts.length - 1].distanceTo(sleigh.position) > .8) trailPts.push(new THREE.Vector3(x, y + .3, 0));
    }
  } else if (phase === 'slide'){
    landing.v = Math.max(0, landing.v - 14 * dt);
    const nx = sleigh.position.x + landing.v * dt;
    if (!(isAngles() && sleigh.position.x < PLAT_X && nx >= PLAT_X - .4)) sleigh.position.x = nx;
    sleigh.position.y = landY(sleigh.position.x);
    if (landing.v <= 0){ phase = 'done'; $('#launchBtn').disabled = false; $('#launchBtn').textContent = '🛷 Again!'; setTimeout(() => { if (phase === 'done') parkSleigh(); }, 2200); }
  }

  // camera
  const sx = sleigh.position.x, sy = sleigh.position.y;
  let want, look;
  const far = Math.max(36, (targetX() || 0) + 6);
  if (camMode === 'chase' && phase !== 'idle'){
    want = new THREE.Vector3(sx - 11, sy + 4.5, 6); look = new THREE.Vector3(sx + 6, sy + 1, 0);
  } else {
    const left = isAngles() ? Math.min(-12, -LIP / Math.tan(angle * Math.PI / 180) - 8) : -14, right = far + 3;
    const span = right - left, d = Math.max(26, span / (1.25 * Math.min(1.8, camera.aspect) / 1.75));
    if (phase === 'idle' || phase === 'done'){
      const cx = (left + right) / 2;
      want = new THREE.Vector3(cx, 8.5, d); look = new THREE.Vector3(cx, 6, 0);
    } else {
      const cx = phase === 'ride' && sx < left ? Math.max(-60, sx + 8) : Math.max(left + span * .3, Math.min(sx + 4, right - span * .3)), cy = Math.max(6, sy * .8 + 2);
      want = new THREE.Vector3(cx, cy + 2.5, Math.max(26, d * .8) + Math.max(0, sy - 10) * 1.4); look = new THREE.Vector3(cx, cy, 0);
    }
  }
  const k = 1 - Math.pow(.04, dt);
  camPos.lerp(want, k); camLook.lerp(look, k);
  camera.position.copy(camPos); camera.lookAt(camLook);

  // ambient bits
  const pa = snowGeo.attributes.position.array;
  for (let i = 0; i < SNOWN; i++){ pa[i*3+1] -= dt * (1.4 + (i % 7) * .15); pa[i*3] += Math.sin(now / 1000 + i) * dt * .3; if (pa[i*3+1] < 0) pa[i*3+1] = 40; }
  snowGeo.attributes.position.needsUpdate = true;
  snow.position.x = camPos.x * .9;
  targetGroup.traverse(o => { if (o.userData.bob) o.position.y = 4 + Math.sin(now / 300) * .4; });
  for (let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i]; p.userData.life -= dt * 1.2; p.userData.v.y -= 9 * dt;
    p.position.addScaledVector(p.userData.v, dt); p.material.opacity = Math.max(0, p.userData.life);
    if (p.userData.life <= 0){ scene.remove(p); puffs.splice(i, 1); }
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}

addEventListener('resize', resize); resize();

  const r = theta * Math.PI / 180, cx = 85, cy = 88, R = 72;
  let ticks = '';
  for (let a = 0; a <= 180; a += 10){ const t = a * Math.PI / 180, l = a % 30 ? 6 : 11; ticks += `<line x1="${cx + Math.cos(t) * R}" y1="${cy - Math.sin(t) * R}" x2="${cx + Math.cos(t) * (R - l)}" y2="${cy - Math.sin(t) * (R - l)}" stroke="#555" stroke-width="1.5"/>`; if (!hide && a % 30 === 0) ticks += `<text x="${cx + Math.cos(t) * (R - 20)}" y="${cy - Math.sin(t) * (R - 20) + 4}" font-size="10" font-weight="800" text-anchor="middle" fill="#555" font-family="Nunito,Arial">${180 - a}</text>`; }
  // ramp goes up to the right from the left end: angle measured from the right-pointing ground
  const ex = cx + Math.cos(Math.PI - r) * -R * -1, ey = cy - Math.sin(r) * R;
  const ax = cx + Math.cos(r) * 30 * -1, ay = cy - Math.sin(r) * 30;
  return `<svg class="prot" viewBox="0 0 170 96">
    <path d="M${cx - R} ${cy} A${R} ${R} 0 0 1 ${cx + R} ${cy} Z" fill="#fdf6e3" stroke="#555" stroke-width="2"/>${ticks}
    <path d="M${cx - 30} ${cy} A30 30 0 0 1 ${cx - Math.cos(r) * 30} ${cy - Math.sin(r) * 30} L${cx} ${cy} Z" fill="rgba(245,197,66,.55)"/>
    <line x1="${cx}" y1="${cy}" x2="${cx - R}" y2="${cy}" stroke="#333" stroke-width="3"/>
    <line x1="${cx}" y1="${cy}" x2="${cx - Math.cos(r) * R}" y2="${cy - Math.sin(r) * R}" stroke="#c0262d" stroke-width="5" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="4" fill="#333"/>
  </svg>`;
}
function hideNow(){ return !revealDeg && (ST.hide || (ST.mode === 'challenge' && !!Q && !!Q.hideDeg)); }
function renderControls(){
  let h = '';
  if (isAngles()){
    const hid = hideNow();
    h = `${protractorSVG(angle, hid)}
      <div class="deg" id="degOut">${hid ? '?°' : angle + '°'}<small>ramp angle</small></div>
      <div class="adj">
        <input type="range" id="angIn" min="10" max="80" step="1" value="${angle}" aria-label="Ramp angle">
        <div class="row"><button class="btn sm" data-d="-5">−5</button><button class="btn sm" data-d="-1">−1</button><button class="btn sm" data-d="1">+1</button><button class="btn sm" data-d="5">+5</button>
        <button class="btn sm${ST.hide ? ' on' : ''}" id="hideBtn" title="Hide the degrees so students estimate">🙈</button></div>
      </div>`;
  } else if (ST.band === 'k1'){
    h = Object.keys(SIZES).map(s => `<button class="btn size${sizeName === s ? ' on' : ''}" data-s="${s}">${{small:'Small', medium:'Medium', big:'Big'}[s]}</button>`).join('');
  } else {
    const cols = ['#d64045', '#2a9d55', '#3d7be0', '#e8b923', '#8e5bd6'];
    h = `<button class="btn size" data-k="-1" style="min-width:64px">−</button>
      <div class="blocks">${Array.from({length:blocks}, (_, i) => `<i style="background:${cols[i % 5]}"></i>`).join('')}</div>
      <div class="deg">${blocks}<small>block${blocks === 1 ? '' : 's'} tall</small></div>
      <button class="btn size" data-k="1" style="min-width:64px">+</button>`;
  }
  h += `<button class="launch" id="launchBtn"${phase === 'idle' || phase === 'done' ? '' : ' disabled'}>🛷 Launch!</button>`;
  $('#controls').innerHTML = h;
  const setAngle = a => { angle = Math.max(10, Math.min(80, a)); if (phase === 'done') parkSleigh(); revealDeg = false; buildRamp(); renderControls(); };
  const ai = $('#angIn'); if (ai) ai.oninput = () => { angle = +ai.value; if (phase === 'done') parkSleigh(); revealDeg = false; buildRamp(); $('#degOut').innerHTML = (hideNow() ? '?°' : angle + '°') + '<small>ramp angle</small>'; $('#controls .prot').outerHTML = protractorSVG(angle, hideNow()); };
  $('#controls').querySelectorAll('[data-d]').forEach(b => b.onclick = () => setAngle(angle + +b.dataset.d));
  const hb = $('#hideBtn'); if (hb) hb.onclick = () => { ST.hide = !ST.hide; save(); buildRamp(); renderControls(); };
  $('#controls').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { sizeName = b.dataset.s; blocks = SIZES[sizeName]; if (phase === 'done') parkSleigh(); buildRamp(); renderControls(); });
  $('#controls').querySelectorAll('[data-k]').forEach(b => b.onclick = () => { blocks = Math.max(1, Math.min(8, blocks + +b.dataset.k)); if (phase === 'done') parkSleigh(); buildRamp(); renderControls(); });
  $('#launchBtn').onclick = launch;
}
const TIPS = {
  angles:['Which angle makes Santa fly the <b>farthest</b>? Test a few and compare.', 'Try <b>30°</b>, then <b>60°</b>. What do you notice about where Santa lands?', 'Try <b>20°</b> and <b>70°</b>. Then <b>35°</b> and <b>55°</b>. What do the pairs add up to?', 'Which is higher: a <b>75°</b> jump or a <b>15°</b> jump? Which one is longer?', 'Turn on 🙈 and estimate: can someone set exactly <b>45°</b> without looking?'],
  k1:['Which ramp makes Santa go the <b>farthest</b>?', 'Which ramp is the <b>shortest</b>? Where does Santa land?', 'Guess first! Which house will the <b>medium</b> ramp reach?'],
  g23:['Each number on the snow shows where that many blocks will land.', 'How many blocks do you need to go past <b>20 m</b>?', 'Does <b>one more block</b> always make Santa go farther?'],
};
let tipI = 0;
function renderCard(){
  let h;
  if (ST.mode === 'challenge'){
    if (!Q) Q = makeQuestion();
    h = `<h2>🎯 Question ${qNum}</h2><p class="prompt">${Q.text}</p>${Q.d ? diagramSVG(Q.d) : ''}<p class="tip">${Q.sub || ''}</p>
      ${showAns ? `<div class="ans">✅ ${Q.expl}</div>` : ''}
      <div class="row" style="margin-top:8px"><button class="btn" id="ansBtn">${showAns ? '🙈 Hide answer' : '👀 Answer'}</button><button class="btn gold" id="nextBtn">⏭ Next question</button></div>`;
  } else {
    const list = isAngles() ? TIPS.angles : TIPS[ST.band];
    h = `<h2>🧪 Free play</h2><p class="tip">${list[tipI % list.length]}</p>
      <div class="row" style="margin-top:10px"><button class="btn" id="tipBtn">💡 Another idea</button><button class="btn" id="clrBtn">🧹 Clear trails</button></div>`;
  }
  $('#card').innerHTML = h;
  const a = $('#ansBtn'); if (a) a.onclick = () => { showAns = !showAns; renderCard(); };
  const n = $('#nextBtn'); if (n) n.onclick = () => { Q = makeQuestion(); trails.clear(); parkSleigh(); hideBanner(); buildTargets(); renderCard(); renderControls(); };
  const t = $('#tipBtn'); if (t) t.onclick = () => { tipI++; renderCard(); };
  const c = $('#clrBtn'); if (c) c.onclick = () => trails.clear();
}
function applyBand(){
  document.querySelectorAll('#bands button').forEach(b => b.classList.toggle('on', b.dataset.b === ST.band));
  document.querySelectorAll('#modes button').forEach(b => b.classList.toggle('on', b.dataset.m === ST.mode));
  plateau.visible = isAngles();
  if (ST.band === 'k1'){ blocks = SIZES[sizeName]; }
  Q = ST.mode === 'challenge' ? makeQuestion() : null; qNum = ST.mode === 'challenge' ? 1 : 0;
  trails.clear(); hideBanner(); revealDeg = false;
  buildRamp(); buildTown(); buildMarkers(); buildTargets(); parkSleigh();
  renderCard(); renderControls();
}
document.querySelectorAll('#bands button').forEach(b => b.onclick = () => { if (phase === 'ride' || phase === 'fly') return; ST.band = b.dataset.b; save(); qNum = 0; applyBand(); });
document.querySelectorAll('#modes button').forEach(b => b.onclick = () => { if (phase === 'ride' || phase === 'fly') return; ST.mode = b.dataset.m; save(); applyBand(); });
$('#camBtn').onclick = () => { camMode = camMode === 'side' ? 'chase' : 'side'; $('#camBtn').textContent = camMode === 'side' ? '🎥 Side' : '🎥 Ride along'; };
const sndLabel = () => $('#sndBtn').textContent = store.sound ? '🔊' : '🔇';
$('#sndBtn').onclick = () => { store.sound = !store.sound; save(); sndLabel(); };
if (EMBED){ $('#hubBtn').classList.remove('hidden'); $('#hubBtn').onclick = () => window.parent.postMessage({type:'twr-close'}, '*'); }
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); launch(); }
  if (isAngles() && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')){ e.preventDefault(); angle = Math.max(10, Math.min(80, angle + (e.key === 'ArrowRight' ? 1 : -1))); if (phase === 'done') parkSleigh(); revealDeg = false; buildRamp(); renderControls(); }
});

let bannerT;
function showBanner(t, s){ const b = $('#banner'); b.innerHTML = t + (s ? `<small>${s}</small>` : ''); b.classList.add('show'); clearTimeout(bannerT); bannerT = setTimeout(hideBanner, 6000); }
function hideBanner(){ $('#banner').classList.remove('show'); }
function confetti(){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const colors = ['#f5c542', '#d64045', '#2fbf71', '#4aa3ff', '#ff8fc7'];
  for (let i = 0; i < 110; i++){
    const el = document.createElement('div'); el.style.cssText = `position:fixed;width:12px;height:18px;z-index:30;pointer-events:none;border-radius:2px;left:${innerWidth / 2}px;top:${innerHeight * .35}px;background:${colors[i % 5]}`;
    document.body.appendChild(el);
    const dx = (Math.random() - .5) * innerWidth, dy = -100 - Math.random() * 400, r = (Math.random() - .5) * 900;
    try { el.animate([{transform:'translate(0,0)'}, {transform:`translate(${dx}px,${dy}px) rotate(${r}deg)`, offset:.4}, {transform:`translate(${dx * 1.2}px,${dy + 800}px) rotate(${r * 2}deg)`, opacity:0}], {duration:2200, easing:'cubic-bezier(.15,.7,.4,1)'}).onfinish = () => el.remove(); } catch(e) { el.remove(); }
  }
}

$('#delivered').textContent = ST.delivered; sndLabel();
applyBand();
camPos.set(0, 9, 52); camLook.set(0, 4, 0);
requestAnimationFrame(frame);
window.__sleigh = {get phase(){ return phase; }, get Q(){ return Q; }, setAngle:a => { angle = a; buildRamp(); renderControls(); }, setBlocks:b => { blocks = b; buildRamp(); renderControls(); }, setSize:s => { sizeName = s; blocks = SIZES[s]; buildRamp(); renderControls(); }, targetX, rangeAngle, rangeBlocks, launch, get x(){ return sleigh.position.x; }};
