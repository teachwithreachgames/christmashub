<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hot Takes | Teach With Reach Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg1:#6b2413;--bg2:#1a0705;--cream:#fdf6e3;--gold:#f5c542;--red:#e2524a;--green:#2fbf71;--panel:rgba(255,255,255,.08);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html{background:var(--bg2)}
html,body{margin:0;min-height:100%}
body{font-family:Nunito,system-ui,sans-serif;color:var(--cream);background:radial-gradient(1300px 800px at 50% -10%,var(--bg1),var(--bg2)) fixed;user-select:none;-webkit-user-select:none;display:flex;flex-direction:column;min-height:100vh}
button,input{font:inherit}
.hidden{display:none!important}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--panel);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;min-height:46px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.16)}
.btn.on,.btn.gold{background:var(--gold);color:#2a1d00;border-color:transparent}
.big{font-family:'Lilita One',cursive;font-weight:400;font-size:clamp(20px,2vw,28px);padding:12px 24px;min-height:62px;border-radius:16px}
header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:rgba(0,0,0,.3);border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-family:'Lilita One',cursive;font-weight:400;margin:0 6px;font-size:clamp(20px,2vw,30px);white-space:nowrap}
h1 span{color:var(--gold)}
.spacer{flex:1}
.count{font-weight:900;opacity:.85}
main{flex:1;display:flex;flex-direction:column;align-items:center;gap:16px;padding:18px;max-width:1300px;margin:0 auto;width:100%}
.take{background:var(--cream);color:#2a0f0a;border-radius:26px;padding:clamp(18px,3vw,40px);text-align:center;width:100%;box-shadow:0 16px 50px rgba(0,0,0,.5);position:relative}
.take .lab{font-weight:900;letter-spacing:.12em;color:#c2410c;font-size:15px}
.take .t{font-family:'Lilita One',cursive;font-size:clamp(30px,5vw,76px);line-height:1.08;margin:8px 0 4px}
.take .how{font-weight:800;color:#6b4a42;font-size:clamp(15px,1.5vw,20px)}
.sides{display:grid;grid-template-columns:1fr 1fr;gap:16px;width:100%}
.side{border-radius:22px;padding:14px;text-align:center;border:3px solid transparent}
.side.a{background:rgba(47,191,113,.2);border-color:var(--green)}
.side.d{background:rgba(226,82,74,.2);border-color:var(--red)}
.side h3{font-family:'Lilita One',cursive;font-weight:400;font-size:clamp(22px,2.6vw,38px);margin:0}
.side .where{font-weight:800;opacity:.8;font-size:15px}
.num{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:8px}
.num input{width:2.6em;font-family:'Lilita One',cursive;font-size:clamp(40px,5vw,72px);text-align:center;background:rgba(0,0,0,.3);color:#fff;border:0;border-radius:14px;padding:0;-moz-appearance:textfield}
.num input::-webkit-outer-spin-button,.num input::-webkit-inner-spin-button{-webkit-appearance:none}
.num button{width:64px;height:64px;border-radius:50%;border:0;font-size:34px;font-weight:900;cursor:pointer;color:#fff}
.a .num button{background:var(--green)}.d .num button{background:var(--red)}
.num button.minus{background:rgba(255,255,255,.15);width:48px;height:48px;font-size:26px}
.result{width:100%}
.bar{display:flex;height:clamp(60px,9vh,96px);border-radius:20px;overflow:hidden;background:rgba(255,255,255,.1);font-family:'Lilita One',cursive;font-size:clamp(24px,3vw,44px)}
.bar div{display:grid;place-items:center;transition:width 1.2s cubic-bezier(.2,.9,.3,1);overflow:hidden;white-space:nowrap;width:50%}
.bar .ba{background:var(--green);color:#052b16}.bar .bd{background:var(--red);color:#fff}
.verdict{text-align:center;font-family:'Lilita One',cursive;font-size:clamp(24px,3vw,44px);margin-top:10px}
.others{text-align:center;font-weight:800;opacity:.85;margin-top:4px}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center}
.clock{font-family:'Lilita One',cursive;font-size:34px;min-width:90px;text-align:center}
.clock.low{color:var(--red)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:40;padding:16px}
.sheet{background:#2a0f0a;border:1px solid var(--line);border-radius:20px;padding:18px 20px;width:min(860px,100%);max-height:90vh;overflow:auto}
.sheet h2{font-family:'Lilita One',cursive;font-weight:400;color:var(--gold);margin:0 0 8px}
.row{display:grid;grid-template-columns:26px 1fr 150px;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);cursor:pointer}
.row input{width:22px;height:22px;accent-color:var(--gold)}
.mini{display:flex;height:16px;border-radius:8px;overflow:hidden;background:rgba(255,255,255,.1)}
.mini i{display:block;background:var(--green)}.mini u{display:block;background:var(--red)}
.in{width:100%;background:rgba(255,255,255,.1);color:var(--cream);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:46px;user-select:text;-webkit-user-select:text}
.hint{opacity:.72;font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--cream);color:#2a0f0a;padding:10px 18px;border-radius:12px;font-weight:900;z-index:50;transition:opacity .4s;pointer-events:none}
</style>
<script data-goatcounter="https://teachwithreach.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>
<header>
  <button class="btn hidden" id="hubBtn">🏠 Hub</button>
  <h1>🔥 Hot <span>Takes</span></h1>
  <span class="count" id="count"></span>
  <div class="spacer"></div>
  <button class="btn" id="listBtn">📋 All takes</button>
  <button class="btn" id="sndBtn" title="Sound on/off">🔊</button>
</header>
<main id="main"></main>
<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" style="opacity:0"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params = new URLSearchParams(location.search), EMBED = params.has('embed');
function track(name){ try { if (window.goatcounter && window.goatcounter.count) window.goatcounter.count({path:'event/' + name, title:name, event:true}); } catch(e) {} }

/* Light-hearted, classroom-safe opinions. Nothing about religion, politics, money or family situations. */
const TAKES = [
  ['music', 'Christmas music should not be played before December 1.'],
  ['cocoa', 'Hot chocolate is better than eggnog.'],
  ['realtree', 'A real tree is better than a fake tree.'],
  ['giftcard', 'Gift cards are a lazy gift.'],
  ['homealone', 'Home Alone is the best holiday movie ever made.'],
  ['elf', 'Elf is overrated.'],
  ['candycane', 'Candy canes are the worst holiday candy.'],
  ['winter', 'Winter is better than summer.'],
  ['socks', 'Socks are actually a great gift.'],
  ['lights', 'Holiday lights should come down by January 15.'],
  ['mariah', '“All I Want for Christmas Is You” is the best holiday song.'],
  ['white', 'White lights look better than coloured lights.'],
  ['fruitcake', 'Fruitcake deserves more respect.'],
  ['homemade', 'A homemade gift is better than a store-bought gift.'],
  ['bags', 'Gift bags are better than wrapping paper.'],
  ['sweater', 'Ugly holiday sweaters are actually cool.'],
  ['turkey', 'Turkey is overrated.'],
  ['gingerbread', 'Gingerbread houses are for looking at, not eating.'],
  ['skate', 'Skating is better than sledding.'],
  ['snowball', 'Snowball fights should be an Olympic sport.'],
  ['grinch', 'The Grinch had a point about all the noise.'],
  ['peek', 'Peeking at your presents ruins the surprise.'],
  ['resolutions', 'New Year’s resolutions are pointless.'],
  ['marshmallow', 'Hot chocolate needs marshmallows.'],
  ['secret', 'Secret Santa is better than buying for everyone.'],
  ['regift', 'Regifting is totally fine.'],
  ['early', 'Decorating before mid-November is too early.'],
  ['experience', 'An experience is a better gift than a thing.'],
  ['toque', 'A toque is better than a hood.'],
  ['mint', 'Mint chocolate is the best holiday flavour.'],
  ['leftovers', 'Leftovers are better than the actual holiday dinner.'],
  ['everyoneskate', 'Everyone in Canada should learn to skate.'],
  ['boxing', 'Boxing Day shopping is not worth the crowds.'],
  ['sleepin', 'Holiday mornings should not start before 9 a.m.'],
  ['food', 'The food is the best part of the holidays.'],
  ['snowday', 'A snow day is better than a P.A. day.'],
  ['shovel', 'Shovelling snow is a good workout, not a chore.'],
  ['pyjamas', 'Pyjama day should happen once a month at school.'],
  ['claymation', 'The old stop-motion holiday specials are better than the new movies.'],
  ['cards', 'Paper holiday cards are still worth sending.'],
  ['icecream', 'Ice cream is still good in winter.'],
  ['snowman', 'Building a snowman is fun at any age.'],
];

const KEY = 'twr-hottakes-v1';
let store; try { store = JSON.parse(localStorage.getItem(KEY)); } catch(e) {}
store = Object.assign({custom:[], off:{}, sound:true, classes:{}}, store || {});
let classId = 'default', hubClasses = [];
try { const hub = JSON.parse(localStorage.getItem('twr-hub-v1')); if (hub && hub.classes && hub.classes.length){ hubClasses = hub.classes; const w = params.get('class') || hub.current; classId = (hub.classes.find(c => c.id === w) || hub.classes[0]).id; } } catch(e) {}
const CL = store.classes[classId] = Object.assign({votes:{}, order:[], idx:0}, store.classes[classId] || {});
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(store)); } catch(e) {} };
const all = () => [...store.custom, ...TAKES].filter(t => !store.off[t[0]]);
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function syncOrder(){
  const ids = all().map(t => t[0]);
  CL.order = CL.order.filter(id => ids.includes(id));
  const missing = shuffle(ids.filter(id => !CL.order.includes(id)));
  CL.order.push(...missing);
  CL.idx = Math.max(0, Math.min(CL.idx, CL.order.length - 1)); save();
}
const cur = () => all().find(t => t[0] === CL.order[CL.idx]);

let shown = false, clock = 0, clockT = null;
let AC = null;
function tone(f, t0, dur, type = 'sine', vol = .1){ if (!store.sound) return; try { AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + t0; o.type = type; o.frequency.setValueAtTime(f, t); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .05); } catch(e) {} }

function verdict(a, d){
  const n = a + d; if (!n) return '';
  const p = a / n * 100;
  if (p >= 40 && p <= 60) return '🔥 Now THAT’S a hot take. The class is split!';
  if (p >= 85) return '🧊 Ice cold. Almost everyone agrees.';
  if (p <= 15) return '🌶️ Scorching! Almost nobody agrees.';
  return p > 50 ? '👍 Most of the class agrees.' : '👎 Most of the class disagrees.';
}
function render(){
  syncOrder();
  const t = cur();
  if (!t){ $('#main').innerHTML = '<p>No takes are ticked. Open 📋 All takes.</p>'; return; }
  const v = CL.votes[t[0]] || [0, 0], n = v[0] + v[1], pa = n ? Math.round(v[0] / n * 100) : 50;
  $('#count').textContent = `Take ${CL.idx + 1} of ${CL.order.length}`;
  const others = hubClasses.filter(c => c.id !== classId).map(c => { const o = ((store.classes[c.id] || {}).votes || {})[t[0]]; return o && o[0] + o[1] ? `${esc(c.name)}: ${Math.round(o[0] / (o[0] + o[1]) * 100)}% agreed` : null; }).filter(Boolean);
  $('#main').innerHTML = `
    <div class="take"><div class="lab">🔥 HOT TAKE</div><div class="t">${esc(t[1])}</div><div class="how">Agree? Move to the left side of the room. Disagree? Move to the right.</div></div>
    <div class="sides">
      ${[['a', '👍 Agree', '⬅ left side', 0], ['d', '👎 Disagree', 'right side ➡', 1]].map(([c, lab, where, i]) => `<div class="side ${c}"><h3>${lab}</h3><div class="where">${where}</div>
        <div class="num"><button class="minus" data-d="${i}" data-by="-1" aria-label="One fewer">−</button><input type="number" min="0" inputmode="numeric" data-in="${i}" value="${v[i]}" aria-label="${lab} count"><button data-d="${i}" data-by="1" aria-label="One more">+</button></div></div>`).join('')}
    </div>
    <div class="result${shown ? '' : ' hidden'}" id="result">
      <div class="bar"><div class="ba" style="width:${shown ? pa : 50}%">${n ? pa + '%' : ''}</div><div class="bd" style="width:${shown ? 100 - pa : 50}%">${n ? (100 - pa) + '%' : ''}</div></div>
      <div class="verdict">${verdict(v[0], v[1])}</div>
      ${others.length ? `<div class="others">Other classes: ${others.join(' · ')}</div>` : ''}
    </div>
    <div class="ctrl">
      <button class="btn big" id="prevBtn">◀</button>
      <button class="btn big gold" id="showBtn">${shown ? '🙈 Hide results' : '📊 Show results'}</button>
      <button class="btn" data-clock="30">⏱ 30 s</button><button class="btn" data-clock="60">⏱ 60 s</button>
      <div class="clock${clock && clock <= 5 ? ' low' : ''}" id="clock">${clock ? clock : ''}</div>
      <button class="btn big" id="nextBtn">Next take ▶</button>
    </div>
    <p class="hint" style="margin:0">Count each side and tap + (or type the number). Use the timer to give each side a turn to defend their answer.</p>`;
  const setV = (i, val) => { const vv = CL.votes[t[0]] = CL.votes[t[0]] || [0, 0]; vv[i] = Math.max(0, Math.min(99, val)); save(); };
  document.querySelectorAll('[data-d]').forEach(b => b.onclick = () => { setV(+b.dataset.d, (CL.votes[t[0]] || [0, 0])[+b.dataset.d] + +b.dataset.by); tone(b.dataset.d === '0' ? 660 : 440, 0, .08, 'triangle'); render(); });
  document.querySelectorAll('[data-in]').forEach(inp => { inp.onchange = () => { setV(+inp.dataset.in, parseInt(inp.value, 10) || 0); render(); }; inp.onfocus = () => inp.select(); });
  $('#showBtn').onclick = toggleShow;
  $('#prevBtn').onclick = () => go(-1); $('#nextBtn').onclick = () => go(1);
  document.querySelectorAll('[data-clock]').forEach(b => b.onclick = () => startClock(+b.dataset.clock));
}
function toggleShow(){
  const t = cur(), v = CL.votes[t[0]] || [0, 0];
  if (!shown && !(v[0] + v[1])){ toast('Count the two sides first'); return; }
  shown = !shown; render();
  if (shown){
    // animate the bar from 50/50
    const ba = $('.ba'), bd = $('.bd'), pa = Math.round(v[0] / (v[0] + v[1]) * 100);
    ba.style.width = '50%'; bd.style.width = '50%'; void ba.offsetWidth; ba.style.width = pa + '%'; bd.style.width = (100 - pa) + '%';
    [523, 659, 784].forEach((f, i) => tone(f, i * .12, .3, 'triangle')); track('hottakes-reveal');
  }
}
function go(d){ stopClock(); shown = false; CL.idx = (CL.idx + d + CL.order.length) % CL.order.length; save(); render(); }
function startClock(s){ stopClock(); clock = s; drawClock(); clockT = setInterval(() => { clock--; if (clock <= 5 && clock > 0) tone(880, 0, .06, 'square', .05); if (clock <= 0){ stopClock(); tone(220, 0, .6, 'sawtooth', .12); toast('⏰ Time!'); } drawClock(); }, 1000); }
function stopClock(){ clearInterval(clockT); clockT = null; clock = 0; }
function drawClock(){ const c = $('#clock'); if (c){ c.textContent = clock || ''; c.classList.toggle('low', clock > 0 && clock <= 5); } }

$('#listBtn').onclick = openList;
function openList(){
  const rows = [...store.custom.map(t => [...t, true]), ...TAKES].map(t => {
    const v = CL.votes[t[0]] || [0, 0], n = v[0] + v[1];
    return {t, n, pa:n ? v[0] / n * 100 : null};
  });
  const spicy = rows.filter(r => r.n).sort((a, b) => Math.abs(a.pa - 50) - Math.abs(b.pa - 50)).slice(0, 3);
  $('#sheet').innerHTML = `<h2>📋 All takes</h2>
    ${spicy.length ? `<p><b>🌶️ This class’s most divisive takes:</b><br>${spicy.map(r => `${esc(r.t[1])} <span class="hint">(${Math.round(r.pa)}% agreed)</span>`).join('<br>')}</p>` : ''}
    <div style="display:flex;gap:8px;margin:10px 0"><input class="in" id="newTake" maxlength="110" placeholder="Add your own take, e.g. Our school should have a skating day."><button class="btn gold" id="addTake">Add</button></div>
    <p class="hint">Tap a take to jump to it. Untick any you’d like to skip. Green shows how much of this class agreed.</p>
    ${rows.map(r => `<div class="row" data-go="${r.t[0]}"><input type="checkbox" data-on="${r.t[0]}"${store.off[r.t[0]] ? '' : ' checked'}><span>${esc(r.t[1])}${r.t[2] ? ' <a href="#" data-del="' + r.t[0] + '" style="color:#ffb1a8;font-size:13px">delete</a>' : ''}</span>${r.n ? `<div class="mini" title="${Math.round(r.pa)}% agreed"><i style="width:${r.pa}%"></i><u style="width:${100 - r.pa}%"></u></div>` : '<span class="hint">not voted yet</span>'}</div>`).join('')}
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:14px;flex-wrap:wrap"><button class="btn" id="clearVotes">🧹 Clear this class’s votes</button><button class="btn" id="reshuffle">🔀 Shuffle the order</button><button class="btn gold" id="closeList">Done</button></div>`;
  $('#modal').classList.remove('hidden');
  $('#sheet').querySelectorAll('[data-on]').forEach(c => { c.onclick = e => e.stopPropagation(); c.onchange = () => { if (c.checked) delete store.off[c.dataset.on]; else store.off[c.dataset.on] = true; save(); }; });
  $('#sheet').querySelectorAll('[data-del]').forEach(a => a.onclick = e => { e.preventDefault(); e.stopPropagation(); store.custom = store.custom.filter(t => t[0] !== a.dataset.del); save(); openList(); });
  $('#sheet').querySelectorAll('[data-go]').forEach(r => r.onclick = () => { if (store.off[r.dataset.go]) return; syncOrder(); const i = CL.order.indexOf(r.dataset.go); if (i >= 0){ CL.idx = i; shown = false; save(); closeList(); } });
  const add = () => { const v = $('#newTake').value.trim(); if (!v) return; const id = 'c' + Date.now(); store.custom.unshift([id, v]); save(); syncOrder(); CL.order = [id, ...CL.order.filter(x => x !== id)]; CL.idx = 0; save(); openList(); toast('Added! It’s up first.'); };
  $('#addTake').onclick = add; $('#newTake').onkeydown = e => { if (e.key === 'Enter') add(); };
  $('#clearVotes').onclick = () => { if (confirm('Clear all of this class’s votes?')){ CL.votes = {}; save(); openList(); } };
  $('#reshuffle').onclick = () => { CL.order = shuffle(CL.order); CL.idx = 0; save(); toast('Shuffled!'); };
  $('#closeList').onclick = closeList;
}
function closeList(){ $('#modal').classList.add('hidden'); shown = false; render(); }
$('#modal').onclick = e => { if (e.target.id === 'modal') closeList(); };
$('#sndBtn').onclick = () => { store.sound = !store.sound; save(); $('#sndBtn').textContent = store.sound ? '🔊' : '🔇'; };
$('#sndBtn').textContent = store.sound ? '🔊' : '🔇';
addEventListener('keydown', e => {
  if (!$('#modal').classList.contains('hidden') || e.target.tagName === 'INPUT') return;
  const t = cur(); if (!t) return;
  const bump = i => { const v = CL.votes[t[0]] = CL.votes[t[0]] || [0, 0]; v[i]++; save(); render(); };
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === 'a' || e.key === 'A') bump(0); else if (e.key === 'd' || e.key === 'D') bump(1);
  else if (e.key === ' '){ e.preventDefault(); toggleShow(); }
});
let toastT;
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2200); }
if (EMBED){ $('#hubBtn').classList.remove('hidden'); $('#hubBtn').onclick = () => { stopClock(); window.parent.postMessage({type:'twr-close'}, '*'); }; }
window.__takes = {CL, store, cur};
render();
</script>
</body>
</html>
