<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build-a-Snowman | Teach With Reach Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--cream:#fdf6e3;--gold:#f5c542;--red:#d64045;--panel:rgba(12,28,40,.86);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden}
body{font-family:Nunito,system-ui,sans-serif;color:var(--cream);background:#cfe3f5;-webkit-user-select:none;user-select:none;display:flex;flex-direction:column}
button,input,textarea{font:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.12);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:9px 14px;font-weight:800;cursor:pointer;min-height:46px;white-space:nowrap}
.btn:hover{background:rgba(255,255,255,.22)}
.btn.gold{background:var(--gold);color:#2a1d00;border-color:transparent}
.btn.red{background:var(--red);border-color:transparent}
.btn.danger{border-color:#d64045;color:#ffb3b5}
.hidden{display:none!important}

header{display:flex;align-items:center;gap:8px;padding:8px 14px;background:#123049;flex-wrap:wrap;z-index:5}
h1{font-family:'Lilita One',cursive;font-weight:400;margin:0 6px;font-size:clamp(20px,2vw,30px);white-space:nowrap}
h1 span{color:#9fd8ff}
.chip{font-weight:800;background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:999px;padding:6px 12px}
.spacer{flex:1}
.name-in{background:rgba(255,255,255,.12);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:9px 12px;min-height:46px;width:200px}
.name-in::placeholder{color:rgba(253,246,227,.55)}

#stageWrap{flex:1;position:relative;min-height:0;background:#dde9f4}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.part{cursor:grab}
.part:hover{filter:drop-shadow(0 0 6px rgba(255,255,255,.9))}
body.dragging,body.dragging .part{cursor:grabbing}
#selBox rect{fill:none;stroke:#f5c542;stroke-width:4;stroke-dasharray:12 8;vector-effect:non-scaling-stroke}

.seltools{position:absolute;z-index:6;left:50%;bottom:12px;display:flex;gap:6px;background:var(--panel);border:1px solid var(--line);padding:6px;border-radius:14px;transform:translateX(-50%);backdrop-filter:blur(4px)}
.seltools button{width:48px;height:48px;border-radius:10px;border:0;background:rgba(255,255,255,.12);color:#fff;font-size:22px;cursor:pointer}
.seltools button:hover{background:rgba(255,255,255,.25)}
.seltools button.del{background:#b3262c}

.tray{background:#123049;padding:6px 12px 8px;z-index:5}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px}
.tab{flex:0 0 auto;background:rgba(255,255,255,.08);color:var(--cream);border:2px solid transparent;border-radius:12px;padding:4px 12px;font-weight:800;cursor:pointer;font-size:16px;min-height:40px}
.tab.on{border-color:var(--gold);background:rgba(245,197,66,.18)}
.items{display:flex;gap:8px;overflow-x:auto;padding:4px 2px}
.tile{flex:0 0 auto;width:90px;height:90px;border-radius:16px;background:linear-gradient(#e9f3fc,#cfe0f0);border:3px solid transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px;color:#123049;font-weight:800;font-size:12px;gap:2px}
.tile:hover{border-color:#9fd8ff;transform:translateY(-2px)}
.tile.on{border-color:var(--gold)}
.tile svg{width:66px;height:54px;overflow:visible}

.toast{position:absolute;left:50%;top:16px;transform:translateX(-50%);background:rgba(18,48,73,.9);padding:10px 18px;border-radius:999px;font-weight:800;z-index:7;transition:opacity .5s;pointer-events:none;text-align:center;max-width:92%}
.melt-msg{position:absolute;left:50%;top:16%;transform:translateX(-50%);font-family:'Lilita One',cursive;font-size:clamp(30px,4vw,60px);color:#fff;text-shadow:0 4px 0 #e8711b,0 8px 20px rgba(0,0,0,.35);z-index:7;pointer-events:none;text-align:center}

.overlay{position:fixed;inset:0;z-index:50;background:rgba(5,15,25,.8);backdrop-filter:blur(4px);display:grid;place-items:center;padding:20px}
.sheet{width:min(860px,96vw);max-height:90vh;overflow:auto;background:#123049;border:1px solid var(--line);border-radius:20px;padding:22px;-webkit-user-select:text;user-select:text}
.sheet h2{font-family:'Lilita One',cursive;font-weight:400;margin:0 0 8px;font-size:30px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.hint{opacity:.7;font-size:14px}
textarea.in{width:100%;min-height:160px;background:rgba(255,255,255,.1);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
.big-name{font-family:'Lilita One',cursive;font-size:clamp(54px,8vw,120px);text-align:center;color:var(--gold);min-height:1.3em;margin:10px 0;text-shadow:0 6px 0 rgba(0,0,0,.25)}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;margin-top:12px}
.g-card{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;position:relative}
.g-card:hover{border-color:var(--gold)}
.g-card svg{display:block;width:100%;height:auto;overflow:hidden}
.g-card .cap{padding:8px 10px;font-weight:800;display:flex;justify-content:space-between;align-items:center;gap:6px}
.g-card .x{background:#b3262c;border:0;color:#fff;border-radius:8px;width:32px;height:32px;cursor:pointer}
</style>
</head>
<body>
<header>
  <button class="btn hidden" id="hubBtn">🏠 Hub</button>
  <h1>⛄ Build-a-<span>Snowman</span></h1>
  <span class="chip" id="classChip"></span>
  <input class="name-in" id="nameIn" maxlength="20" placeholder="Snowman's name…">
  <div class="spacer"></div>
  <button class="btn gold" id="helperBtn">🎲 Pick a helper</button>
  <button class="btn" id="undoBtn">↶ Undo</button>
  <button class="btn" id="meltBtn">☀️ Melt!</button>
  <button class="btn" id="keepBtn">📸 Keep</button>
  <button class="btn" id="galleryBtn">🖼 Gallery</button>
  <button class="btn" id="newBtn">🆕 New</button>
  <button class="btn" id="fsBtn" title="Fullscreen">⛶</button>
</header>

<div id="stageWrap">
  <svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
    <defs id="defs"></defs>
    <g id="bg"></g>
    <g id="snowman">
      <g id="L-arms"></g><g id="L-body"></g><g id="L-buttons"></g><g id="L-scarf"></g>
      <g id="L-mouth"></g><g id="L-nose"></g><g id="L-eyes"></g><g id="L-hat"></g><g id="L-extra"></g>
    </g>
    <g id="puddle"></g>
    <g id="sign"></g>
    <g id="tint" pointer-events="none"></g>
    <g id="snowLayer" pointer-events="none"></g>
    <g id="selBox" pointer-events="none"></g>
  </svg>
  <div class="seltools hidden" id="selTools">
    <button data-act="bigger" title="Bigger">➕</button>
    <button data-act="smaller" title="Smaller">➖</button>
    <button data-act="left" title="Turn left">↺</button>
    <button data-act="right" title="Turn right">↻</button>
    <button data-act="flip" title="Flip">⇋</button>
    <button data-act="del" class="del" title="Remove">🗑</button>
  </div>
  <div class="toast" id="toast">Tap a piece below to add it to the snowman!</div>
  <div class="melt-msg hidden" id="meltMsg"></div>
</div>

<div class="tray">
  <div class="tabs" id="tabs"></div>
  <div class="items" id="items"></div>
</div>

<!-- Helper picker -->
<div class="overlay hidden" id="helperModal">
  <div class="sheet">
    <div class="row" style="justify-content:space-between"><h2>🎲 Pick a helper</h2><button class="btn" data-close>✕</button></div>
    <div class="big-name" id="bigName">Who's next?</div>
    <div class="row" style="justify-content:center">
      <button class="btn gold" id="pickBtn" style="font-size:22px;min-height:60px;padding:0 30px">🎲 Pick!</button>
      <span class="hint" id="turnInfo"></span>
    </div>
    <details style="margin-top:18px">
      <summary style="cursor:pointer;font-weight:800">✏️ Class list</summary>
      <p class="hint">One first name per line. Everyone gets a turn before anyone goes twice.</p>
      <textarea class="in" id="namesIn" placeholder="Maya&#10;Leo&#10;Ava"></textarea>
      <div class="row" style="margin-top:8px"><button class="btn" id="saveNames">Save list</button><button class="btn danger" id="resetTurns">Reset turns</button></div>
    </details>
  </div>
</div>

<!-- Gallery -->
<div class="overlay hidden" id="galleryModal">
  <div class="sheet" style="width:min(1100px,96vw)">
    <div class="row" style="justify-content:space-between"><h2>🖼 Our Snowman Gallery</h2><button class="btn" data-close>✕</button></div>
    <p class="hint">Tap a snowman to bring it back. "📸 Keep" adds the current snowman here.</p>
    <div class="row"><button class="btn" id="pngBtn">⬇ Download current snowman as a picture</button></div>
    <div class="gallery" id="galleryGrid"></div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
const SVGNS = 'http://www.w3.org/2000/svg';
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =====================================================
   ART: gradients + scene
   ===================================================== */
const DEFS = `
<radialGradient id="snowG" cx="38%" cy="30%" r="78%"><stop offset="0" stop-color="#ffffff"/><stop offset=".55" stop-color="#f0f6fc"/><stop offset="1" stop-color="#c3d4e8"/></radialGradient>
<radialGradient id="coalG" cx="35%" cy="30%" r="75%"><stop offset="0" stop-color="#60606a"/><stop offset="1" stop-color="#0e0e12"/></radialGradient>
<linearGradient id="carrotG" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#e8691b"/><stop offset="1" stop-color="#ffb347"/></linearGradient>
<linearGradient id="sky-day" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fa8ff"/><stop offset="1" stop-color="#cfeaff"/></linearGradient>
<linearGradient id="sky-sunset" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2a6b"/><stop offset=".55" stop-color="#e8577a"/><stop offset="1" stop-color="#ffbe76"/></linearGradient>
<linearGradient id="sky-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040a22"/><stop offset="1" stop-color="#22336e"/></linearGradient>
<radialGradient id="glowG"><stop offset="0" stop-color="#fff6c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff6c4" stop-opacity="0"/></radialGradient>
<linearGradient id="hillG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e6f3"/></linearGradient>
<linearGradient id="woodG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b07a45"/><stop offset="1" stop-color="#8a5a2e"/></linearGradient>`;

let seed = 11;
const rnd = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
function pine(x, y, h){
  const w = h * .55, g = '#1f6b3a', d = '#17532c';
  let s = `<rect x="${x-h*.05}" y="${y-h*.12}" width="${h*.1}" height="${h*.14}" fill="#5a3a22"/>`;
  for (let i = 0; i < 3; i++){
    const ty = y - h*.12 - i*h*.26, tw = w * (1 - i*.22), th = h*.42;
    s += `<path d="M${x-tw/2} ${ty} L${x} ${ty-th} L${x+tw/2} ${ty}Z" fill="${i%2?d:g}"/>`;
    s += `<path d="M${x-tw*.18} ${ty-th*.62} L${x} ${ty-th} L${x+tw*.18} ${ty-th*.62} Q ${x} ${ty-th*.55} ${x-tw*.18} ${ty-th*.62}Z" fill="#fff"/>`;
  }
  return s;
}
function cabin(x, y, night){
  const win = night ? '#ffcf5a' : '#ffe9a8';
  return `
  ${night ? `<circle cx="${x+60}" cy="${y-60}" r="70" fill="url(#glowG)" opacity=".7"/>` : ''}
  <rect x="${x-10}" y="${y-210}" width="34" height="70" fill="#8e3b2a"/><rect x="${x-14}" y="${y-216}" width="42" height="12" rx="4" fill="#fff"/>
  <rect x="${x-90}" y="${y-130}" width="200" height="130" fill="#7a4a2a"/>
  ${[0,1,2,3,4].map(i => `<line x1="${x-90}" y1="${y-110+i*24}" x2="${x+110}" y2="${y-110+i*24}" stroke="#5e3820" stroke-width="3"/>`).join('')}
  <path d="M${x-118} ${y-122} L${x+10} ${y-218} L${x+138} ${y-122}Z" fill="#6b2f22"/>
  <path d="M${x-124} ${y-118} L${x+10} ${y-224} L${x+144} ${y-118} L${x+128} ${y-108} L${x+10} ${y-198} L${x-108} ${y-108}Z" fill="#fff"/>
  <rect x="${x-60}" y="${y-92}" width="48" height="44" rx="4" fill="${win}" stroke="#4a2c18" stroke-width="5"/>
  <line x1="${x-36}" y1="${y-92}" x2="${x-36}" y2="${y-48}" stroke="#4a2c18" stroke-width="4"/>
  <rect x="${x+30}" y="${y-80}" width="46" height="80" rx="4" fill="#5a2a1a"/><circle cx="${x+68}" cy="${y-40}" r="4" fill="#f5c542"/>
  <path d="M${x-100} ${y} Q ${x+10} ${y-18} ${x+120} ${y}Z" fill="#fff"/>`;
}
function bgMarkup(sc){
  seed = 11;
  let s = `<rect x="-1400" y="-1200" width="4400" height="2100" fill="url(#sky-${sc})"/>`;
  if (sc === 'day') s += `<circle cx="1370" cy="150" r="140" fill="url(#glowG)"/><circle cx="1370" cy="150" r="62" fill="#ffe066"/>
    <g fill="#fff" opacity=".9"><ellipse cx="260" cy="150" rx="90" ry="34"/><ellipse cx="320" cy="130" rx="70" ry="40"/><ellipse cx="200" cy="140" rx="55" ry="28"/>
    <ellipse cx="880" cy="110" rx="80" ry="28"/><ellipse cx="940" cy="95" rx="60" ry="34"/></g>`;
  if (sc === 'sunset') s += `<circle cx="1180" cy="560" r="260" fill="url(#glowG)" opacity=".85"/><circle cx="1180" cy="560" r="110" fill="#ffd27a"/>`;
  if (sc === 'night'){
    for (let i = 0; i < 200; i++) s += `<circle cx="${(rnd()*3600 - 1000).toFixed(0)}" cy="${(rnd()*480).toFixed(0)}" r="${(rnd()*1.8+.6).toFixed(1)}" fill="#fff" opacity="${(rnd()*.7+.3).toFixed(2)}"/>`;
    s += `<circle cx="1330" cy="160" r="110" fill="url(#glowG)" opacity=".6"/><circle cx="1330" cy="160" r="56" fill="#fdf6d8"/><circle cx="1352" cy="146" r="50" fill="#0b1638"/>`;
  }
  s += `<path d="M-1400 540 C -1000 480 -500 560 -200 520 C -80 505 -40 560 0 560 C 200 470 380 520 560 500 C 760 470 900 540 1080 500 C 1260 460 1420 520 1600 480 C 1900 440 2300 540 3000 500 L3000 900 L-1400 900Z" fill="${sc==='night'?'#9fb0d6':sc==='sunset'?'#f3c6c6':'#e3ecf6'}"/>`;
  s += pine(-520, 620, 200) + pine(-380, 650, 150) + pine(-180, 640, 220) + pine(110, 640, 230) + pine(230, 660, 170) + pine(40, 700, 150) + pine(1530, 640, 240) + pine(1440, 680, 160) + pine(1760, 650, 210) + pine(1900, 630, 170) + pine(2120, 660, 230);
  s += cabin(1240, 655, sc === 'night');
  s += `<path d="M-1400 680 C -900 640 -400 700 0 690 C 300 640 600 700 800 680 C 1050 655 1300 700 1600 660 C 2000 630 2500 690 3000 670 L3000 1000 L-1400 1000Z" fill="url(#hillG)"/>`;
  s += `<path d="M-1400 800 C -700 820 -300 780 0 800 C 300 780 500 820 800 805 C 1100 790 1300 820 1600 800 C 2100 780 2500 820 3000 800" stroke="#c9d9ea" stroke-width="6" fill="none" opacity=".6"/>`;
  return s;
}
const TINTS = {day:'', sunset:'<rect x="-1400" y="-1200" width="4400" height="2200" fill="#ff7a3c" opacity=".10"/>', night:'<rect x="-1400" y="-1200" width="4400" height="2200" fill="#0a1640" opacity=".32"/>'};

/* =====================================================
   SNOWMAN BODIES + anchor points
   ===================================================== */
const BODIES = {
  classic: {label:'Classic', balls:[[800,640,150],[800,445,110],[800,282,80]]},
  two:     {label:'Two snowballs', balls:[[800,630,160],[800,395,105]]},
  chubby:  {label:'Big & round', balls:[[800,615,175],[800,400,125],[800,232,82]]},
};
function anchors(bodyKey){
  const b = BODIES[bodyKey].balls, head = b[b.length-1], under = b[b.length-2], bot = b[0];
  const torso = b.length === 3 ? b[1] : bot;
  const [hx, hy, hr] = head, fs = hr / 80;
  // where the head meets the ball under it (the neck)
  const [ux, uy, ur] = under;
  const ny = ((hr*hr - ur*ur) - (hy*hy - uy*uy)) / (2*(uy - hy));
  const nw = Math.sqrt(Math.max(1, hr*hr - (ny - hy)**2));
  const tY = b.length === 3 ? torso[1] - torso[2]*.18 : bot[1] - bot[2]*.5;
  const btn = b.length === 3
    ? [torso[1]-torso[2]*.42, torso[1]-torso[2]*.02, torso[1]+torso[2]*.38, bot[1]-bot[2]*.5, bot[1]-bot[2]*.15, bot[1]+bot[2]*.2]
    : [bot[1]-bot[2]*.62, bot[1]-bot[2]*.32, bot[1]-bot[2]*.02, bot[1]+bot[2]*.28];
  return {
    fs, neckS: nw/48, armS: .6 + .4*torso[2]/110, btnS: Math.min(1.25, .75 + .25*torso[2]/110),
    hat:[hx, hy - hr + 18*fs], head:[hx, hy], eyes:[hx, hy - hr*.25], nose:[hx, hy + hr*.08], mouth:[hx, hy + hr*.36],
    scarf:[hx, ny + 10*fs], arms:[torso[0], tY], extra:[bot[0], bot[1]], buttons: btn.map(y => [torso[0], y]),
  };
}
function bodyMarkup(bodyKey){
  const b = BODIES[bodyKey].balls, bot = b[0];
  let s = `<ellipse cx="800" cy="790" rx="${bot[2]*1.15}" ry="24" fill="#5a7aa3" opacity=".2"/>`;
  for (const [x, y, r] of b){
    s += `<circle cx="${x}" cy="${y}" r="${r}" fill="url(#snowG)"/>`;
    s += `<path d="M${x-r*.82} ${y+r*.42} A ${r} ${r} 0 0 0 ${x+r*.82} ${y+r*.42}" fill="none" stroke="#a9bfd8" stroke-width="${(r*.05).toFixed(1)}" opacity=".45"/>`;
    s += `<ellipse cx="${x-r*.35}" cy="${y-r*.4}" rx="${r*.2}" ry="${r*.12}" fill="#fff" opacity=".7"/>`;
  }
  return s;
}

/* =====================================================
   PARTS (all drawn at "classic" size around their anchor)
   ===================================================== */
const pair = f => f(-28, -1) + f(28, 1);
function star(cx, cy, R, r, fill, extra=''){
  let d = ''; for (let i = 0; i < 10; i++){ const rr = i%2 ? r : R, a = -Math.PI/2 + i*Math.PI/5; d += (i ? 'L' : 'M') + (cx + Math.cos(a)*rr).toFixed(1) + ' ' + (cy + Math.sin(a)*rr).toFixed(1); }
  return `<path d="${d}Z" fill="${fill}" ${extra}/>`;
}
const heart = (x, y, s, fill) => `<path transform="translate(${x} ${y}) scale(${s})" d="M0 8 C -16 -2 -14 -16 -6 -16 C -2 -16 0 -12 0 -10 C 0 -12 2 -16 6 -16 C 14 -16 16 -2 0 8Z" fill="${fill}"/>`;
function scarf(cols, fringeCol){
  const base = cols[0];
  let s = '';
  const A = [20, 4], B = [56, 6], C = [70, 120], D = [34, 124], n = 6;
  const lerp = (p, q, t) => [p[0] + (q[0]-p[0])*t, p[1] + (q[1]-p[1])*t];
  for (let i = 0; i < n; i++){
    const t0 = i/n, t1 = (i+1)/n, l0 = lerp(A, D, t0), r0 = lerp(B, C, t0), l1 = lerp(A, D, t1), r1 = lerp(B, C, t1);
    s += `<path d="M${l0} L${r0} L${r1} L${l1}Z" fill="${cols[i % cols.length]}"/>`;
  }
  for (let i = 0; i <= 6; i++){ const p = lerp(D, C, i/6); s += `<line x1="${p[0]}" y1="${p[1]}" x2="${p[0]+2}" y2="${p[1]+16}" stroke="${fringeCol}" stroke-width="4" stroke-linecap="round"/>`; }
  s += `<path d="M-68 -14 C -30 -26 30 -26 68 -14 L 72 12 C 30 26 -30 26 -72 12 Z" fill="${base}"/>`;
  if (cols.length > 1){
    s += `<path d="M-70 -4 C -30 -16 30 -16 70 -4" stroke="${cols[1]}" stroke-width="6" fill="none"/>`;
    s += `<path d="M-71 6 C -30 -6 30 -6 71 6" stroke="${cols[2] || cols[1]}" stroke-width="6" fill="none"/>`;
  }
  s += `<ellipse cx="36" cy="8" rx="20" ry="15" fill="${base}"/><ellipse cx="36" cy="8" rx="20" ry="15" fill="#000" opacity=".12"/>`;
  return s;

function partTransform(p, A){

  let base;
  if (it.anchor === 'buttons') base = A.buttons[Math.min(p.slot || 0, A.buttons.length - 1)];
  else base = A[it.anchor];
  const k = {fs:A.fs, neck:A.neckS, arm:A.armS, btn:A.btnS, one:1}[it.scale] || 1;
  const ox = (it.off ? it.off[0] : 0) * (it.scale === 'one' ? 1 : k), oy = (it.off ? it.off[1] : 0) * (it.scale === 'one' ? 1 : k);
  const x = base[0] + ox + (p.dx || 0), y = base[1] + oy + (p.dy || 0), s = k * (p.s || 1);

function partsMarkup(st, withIds){
  const A = anchors(st.body), layers = {arms:'', buttons:'', scarf:'', mouth:'', nose:'', eyes:'', hat:'', extra:''};
  st.parts.forEach((p, i) => {
    const it = ITEM[p.id]; if (!it) return;
    const tr = partTransform(p, A);
    layers[it.cat] += `<g ${withIds ? `class="part" data-i="${i}"` : ''} transform="${tr}">${it.svg}</g>`;
  });
  return layers;
}
function signMarkup(name){
  if (!name) return '';
  const fsz = Math.min(44, 330 / Math.max(4, name.length) * 1.7);
  return `<g transform="translate(330 700)"><rect x="-10" y="-30" width="20" height="120" fill="url(#woodG)"/><rect x="-140" y="-110" width="280" height="86" rx="12" fill="url(#woodG)" stroke="#6b4423" stroke-width="5"/>
  <path d="M-140 -98 Q -140 -122 -110 -118 Q -60 -128 0 -118 Q 70 -128 116 -118 Q 142 -122 140 -98 Q 80 -108 0 -104 Q -80 -108 -140 -98Z" fill="#fff"/>
  <text x="0" y="-56" text-anchor="middle" dominant-baseline="middle" font-family="'Lilita One', 'Arial Rounded MT Bold', Arial, sans-serif" font-size="${fsz.toFixed(0)}" fill="#fff6e0" stroke="#6b4423" stroke-width="2">${esc(name)}</text></g>`;
}
function fullSceneMarkup(st){
  const L = partsMarkup(st, false);
  return `<defs>${DEFS}</defs>${bgMarkup(st.scene)}<g>${L.arms}${bodyMarkup(st.body)}${L.buttons}${L.scarf}${L.mouth}${L.nose}${L.eyes}${L.hat}${L.extra}</g>${signMarkup(st.name)}${TINTS[st.scene]}`;
}
let lastScene = null;
function render(){
  if (lastScene !== S.scene){ $('#bg').innerHTML = bgMarkup(S.scene); $('#tint').innerHTML = TINTS[S.scene]; lastScene = S.scene; }
  $('#L-body').innerHTML = bodyMarkup(S.body);
  const L = partsMarkup(S, true);
  for (const k in L) $('#L-' + k).innerHTML = L[k];
  $('#sign').innerHTML = signMarkup(S.name);
  drawSelection();
  renderItems();
}

/* =====================================================
   TRAY
   ===================================================== */
let curCat = 'hat';
function renderTabs(){
  $('#tabs').innerHTML = CATS.map(c => `<button class="tab${c.id === curCat ? ' on' : ''}" data-cat="${c.id}">${c.label}</button>`).join('');
  $('#tabs').querySelectorAll('.tab').forEach(b => b.onclick = () => { curCat = b.dataset.cat; renderTabs(); renderItems(); });
}
function previewSVG(inner){ return `<svg viewBox="-130 -150 260 260">${inner}</svg>`; }
function renderItems(){
  const box = $('#items');
  if (curCat === 'body'){
    box.innerHTML = Object.entries(BODIES).map(([k, b]) => `<button class="tile${S.body === k ? ' on' : ''}" data-body="${k}"><svg viewBox="600 90 400 720">${bodyMarkup(k)}</svg>${b.label}</button>`).join('');
    box.querySelectorAll('[data-body]').forEach(t => t.onclick = () => { snapshot(); S.body = t.dataset.body; save(); render(); });
    return;
  }
  if (curCat === 'scene'){
    box.innerHTML = Object.entries(SCENES).map(([k, l]) => `<button class="tile${S.scene === k ? ' on' : ''}" data-scene="${k}" style="width:150px"><svg viewBox="0 0 1600 900" style="width:130px;height:70px;border-radius:8px;overflow:hidden">${bgMarkup(k)}</svg>${l}</button>`).join('');
    box.querySelectorAll('[data-scene]').forEach(t => t.onclick = () => { snapshot(); S.scene = t.dataset.scene; save(); render(); });
    return;
  }
  const list = ITEMS.filter(i => i.cat === curCat);
  const used = new Set(S.parts.map(p => p.id));
  box.innerHTML = list.map(i => `<button class="tile${SINGLE.has(i.cat) && used.has(i.id) ? ' on' : ''}" data-id="${i.id}">${previewSVG(i.svg)}${i.name}</button>`).join('');
  // fit each preview to its drawing
  box.querySelectorAll('.tile svg').forEach(svg => { try { const b = svg.getBBox(); const pad = Math.max(b.width, b.height) * .12; svg.setAttribute('viewBox', `${b.x - pad} ${b.y - pad} ${b.width + pad*2} ${b.height + pad*2}`); } catch(e) {} });
  box.querySelectorAll('[data-id]').forEach(t => t.onclick = () => addPart(t.dataset.id));
}
function addPart(id){
  const it = ITEM[id]; snapshot();
  if (SINGLE.has(it.cat)){
    const idx = S.parts.findIndex(p => ITEM[p.id] && ITEM[p.id].cat === it.cat);
    if (idx >= 0){ S.parts[idx] = {id}; select(idx); }
    else { S.parts.push({id}); select(S.parts.length - 1); }
  } else if (it.cat === 'buttons'){
    const A = anchors(S.body), taken = new Set(S.parts.filter(p => ITEM[p.id] && ITEM[p.id].cat === 'buttons').map(p => p.slot));
    let slot = -1; for (let i = 0; i < A.buttons.length; i++) if (!taken.has(i)){ slot = i; break; }
    if (slot < 0){ toast('No more button spots! Drag a button to move it, or remove one.'); undoStack.pop(); return; }
    S.parts.push({id, slot}); select(S.parts.length - 1);
  } else {
    const same = S.parts.filter(p => p.id === id).length;
    S.parts.push({id, dx: same * 30, dy: same * -20}); select(S.parts.length - 1);
  }
  save(); render(); pop(S.parts[sel]);
}
function pop(p){
  const i = S.parts.indexOf(p); const el = document.querySelector(`.part[data-i="${i}"]`); if (!el) return;
  try { el.animate([{opacity:0}, {opacity:1}], {duration:350, easing:'ease-out'}); sparkleAt(el); } catch(e) {}
}

/* =====================================================
   SELECT / DRAG / TOOLS
   ===================================================== */
let sel = -1, drag = null;
const stage = $('#stage');
function svgPoint(e){ const pt = stage.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY; return pt.matrixTransform(stage.getScreenCTM().inverse()); }
function select(i){ sel = i; drawSelection(); }
function drawSelection(){
  const box = $('#selBox'), tools = $('#selTools');
  const el = sel >= 0 ? document.querySelector(`.part[data-i="${sel}"]`) : null;
  if (!el){ box.innerHTML = ''; tools.classList.add('hidden'); return; }
  const b = el.getBBox(), sm = stage.getScreenCTM().inverse().multiply(el.getScreenCTM());
  const pts = [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]].map(([x, y]) => { const p = stage.createSVGPoint(); p.x = x; p.y = y; return p.matrixTransform(sm); });
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const x0 = Math.min(...xs) - 8, y0 = Math.min(...ys) - 8, x1 = Math.max(...xs) + 8, y1 = Math.max(...ys) + 8;
  box.innerHTML = `<rect x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" rx="10"/>`;
  tools.classList.remove('hidden');
}
stage.addEventListener('pointerdown', e => {
  const el = e.target.closest('.part');
  if (!el){ select(-1); return; }
  e.preventDefault();
  const i = +el.dataset.i; select(i);
  const p = svgPoint(e), part = S.parts[i];
  drag = {i, el, sx:p.x, sy:p.y, dx:part.dx || 0, dy:part.dy || 0, moved:false};
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (!drag) return;
  const p = svgPoint(e), part = S.parts[drag.i];
  const ddx = p.x - drag.sx, ddy = p.y - drag.sy;
  if (!drag.moved && Math.hypot(ddx, ddy) < 4) return;
  if (!drag.moved){ drag.moved = true; snapshot(); document.body.classList.add('dragging'); $('#selTools').classList.add('hidden'); }
  part.dx = drag.dx + ddx; part.dy = drag.dy + ddy;
  drag.el.setAttribute('transform', partTransform(part, anchors(S.body)));
  drawSelection(); $('#selTools').classList.add('hidden');
});
const endDrag = () => {
  if (!drag) return;
  if (drag.moved){ const p = S.parts[drag.i]; p.dx = Math.round(p.dx); p.dy = Math.round(p.dy); save(); }
  drag = null; document.body.classList.remove('dragging'); drawSelection();
};
stage.addEventListener('pointerup', endDrag); stage.addEventListener('pointercancel', endDrag);
$('#selTools').querySelectorAll('button').forEach(b => b.onclick = () => {
  const p = S.parts[sel]; if (!p) return; snapshot();
  const a = b.dataset.act;
  if (a === 'bigger') p.s = Math.min(3, (p.s || 1) * 1.15);
  if (a === 'smaller') p.s = Math.max(.35, (p.s || 1) / 1.15);
  if (a === 'left') p.r = ((p.r || 0) - 15) % 360;
  if (a === 'right') p.r = ((p.r || 0) + 15) % 360;
  if (a === 'flip') p.f = !p.f;
  if (a === 'del'){ S.parts.splice(sel, 1); sel = -1; }
  if (p.s) p.s = +p.s.toFixed(3);
  save(); render();
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if ((e.key === 'Delete' || e.key === 'Backspace') && sel >= 0){ e.preventDefault(); $('[data-act="del"]').click(); }
  if ((e.ctrlKey || e.metaKey) && e.key === 'z'){ e.preventDefault(); undo(); }
  if (e.key === 'Escape'){ select(-1); document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden')); }
});
let VB = {x:0, y:0, w:1600, h:900};
function fitStage(){
  const r = $('#stageWrap').getBoundingClientRect(), a = r.width / Math.max(1, r.height);
  let w = 1600, h = 900;
  if (a > 16/9) w = 900 * a; else h = 1600 / a;
  VB = {x:800 - w/2, y:900 - h, w, h};
  stage.setAttribute('viewBox', `${VB.x.toFixed(1)} ${VB.y.toFixed(1)} ${w.toFixed(1)} ${h.toFixed(1)}`);
  drawSelection();
}
addEventListener('resize', fitStage);

/* Put the stage back to normal (no melt, no drag, no selection) */
function resetStage(){
  if (meltRAF) cancelAnimationFrame(meltRAF); meltRAF = 0;
  const sm = $('#snowman');
  sm.removeAttribute('transform'); sm.removeAttribute('opacity'); sm.removeAttribute('style');
  $('#puddle').innerHTML = ''; $('#meltMsg').classList.add('hidden');
  meltTimers.forEach(clearTimeout); meltTimers = []; melting = false;
  drag = null; document.body.classList.remove('dragging');
}
/* Undo */
const undoStack = [];
function snapshot(){ undoStack.push(JSON.stringify(S)); if (undoStack.length > 50) undoStack.shift(); }
function undo(){
  const s = undoStack.pop(); if (!s){ toast('Nothing to undo'); return; }
  resetStage(); C.snow = S = JSON.parse(s); sel = -1; $('#nameIn').value = S.name || ''; save(); render();
}
$('#undoBtn').onclick = undo;

/* Name sign */
$('#nameIn').value = S.name || '';
$('#nameIn').addEventListener('input', e => { S.name = e.target.value.trim(); $('#sign').innerHTML = signMarkup(S.name); save(); });

/* =====================================================
   FALLING SNOW + sparkles
   ===================================================== */
const flakes = [];
{ const g = $('#snowLayer');
  for (let i = 0; i < 150; i++){ const c = document.createElementNS(SVGNS, 'circle'); const f = {el:c, x:Math.random()*2400 - 400, y:Math.random()*900, r:Math.random()*4+1.5, s:Math.random()*40+30, d:Math.random()*6}; c.setAttribute('r', f.r); c.setAttribute('fill', '#fff'); c.setAttribute('opacity', (.5 + Math.random()*.5).toFixed(2)); g.appendChild(c); flakes.push(f); } }
let lastT = performance.now();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function frame(t){
  const dt = Math.min(.05, (t - lastT) / 1000); lastT = t;
  if (!reduce) for (const f of flakes){ f.y += f.s * dt; f.d += dt; f.x += Math.sin(f.d) * .4; if (f.y > 910){ f.y = VB.y - 10; f.x = VB.x + Math.random()*VB.w; } f.el.setAttribute('cx', f.x.toFixed(1)); f.el.setAttribute('cy', f.y.toFixed(1)); }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
function sparkleAt(el){
  const b = el.getBoundingClientRect(), wrap = $('#stageWrap');
  for (let i = 0; i < 12; i++){
    const s = document.createElement('div'); s.textContent = ['✨','❄️','⭐'][i % 3];
    s.style.cssText = `position:absolute;left:${b.left + b.width/2 - wrap.getBoundingClientRect().left}px;top:${b.top + b.height/2 - wrap.getBoundingClientRect().top}px;font-size:22px;pointer-events:none;z-index:8`;
    wrap.appendChild(s);
    const a = Math.random()*6.28, d = 60 + Math.random()*60;
    s.animate([{transform:'translate(-50%,-50%) scale(.4)', opacity:1}, {transform:`translate(calc(-50% + ${Math.cos(a)*d}px), calc(-50% + ${Math.sin(a)*d}px)) scale(1)`, opacity:0}], {duration:700, easing:'ease-out'}).onfinish = () => s.remove();
  }
}

/* =====================================================
   MELT!  (just for fun, it comes back)
   ===================================================== */
let melting = false, meltTimers = [], meltRAF = 0;
/* Drawn frame by frame with plain SVG attributes, so it works in every browser
   (Chrome, Safari, Firefox, Edge) and always comes back. */
function setMeltPose(sx, sy, op, pr, pry){
  const sm = $('#snowman');
  if (sx === 1 && sy === 1){ sm.removeAttribute('transform'); sm.removeAttribute('opacity'); }
  else { sm.setAttribute('transform', `translate(800 790) scale(${sx.toFixed(3)} ${sy.toFixed(3)}) translate(-800 -790)`); sm.setAttribute('opacity', op.toFixed(2)); }
  const pud = $('#pud');
  if (pud){ pud.setAttribute('rx', pr.toFixed(1)); pud.setAttribute('ry', pry.toFixed(1)); }
}
$('#meltBtn').onclick = () => {
  if (melting) return;
  melting = true; select(-1);
  const msg = $('#meltMsg');
  msg.textContent = '☀️ Uh oh… the sun came out!'; msg.classList.remove('hidden');
  $('#puddle').innerHTML = `<ellipse id="pud" cx="800" cy="792" rx="10" ry="4" fill="#9fc6ea" opacity=".85"/>`;
  const t0 = performance.now();
  const lerp = (a, b, t) => a + (b - a) * t;
  (function step(now){
    const t = now - t0;
    if (t < 2600){                       // melting down
      const e = (t / 2600) ** 2;
      setMeltPose(lerp(1, 1.25, e), lerp(1, .12, e), lerp(1, .55, e), lerp(10, 260, e), lerp(4, 34, e));
    } else if (t < 3800){                // puddle
      if (t > 3400) msg.textContent = '❄️ Snow magic… it\'s coming back!';
      setMeltPose(1.25, .12, .55, 260, 34);
    } else if (t < 4900){                // springs back up
      const k = (t - 3800) / 1100;
      if ($('#pud')) $('#puddle').innerHTML = '';
      const sy = k < .75 ? lerp(.12, 1.1, k / .75) : lerp(1.1, 1, (k - .75) / .25);
      const sx = k < .75 ? lerp(1.25, .9, k / .75) : lerp(.9, 1, (k - .75) / .25);
      setMeltPose(sx, sy, Math.min(1, lerp(.55, 1, k / .75)), 0, 0);
    } else {                             // done
      setMeltPose(1, 1, 1, 0, 0);
      if (t > 5200){ msg.classList.add('hidden'); melting = false; meltRAF = 0; return; }
    }
    meltRAF = requestAnimationFrame(step);
  })(t0);
};

/* =====================================================
   HELPER PICKER
   ===================================================== */
const H = C.helpers;
function openModal(id){ $(id).classList.remove('hidden'); }
document.querySelectorAll('[data-close]').forEach(b => b.onclick = () => b.closest('.overlay').classList.add('hidden'));
document.querySelectorAll('.overlay').forEach(o => o.addEventListener('pointerdown', e => { if (e.target === o) o.classList.add('hidden'); }));
const nameList = () => H.names.split('\n').map(s => s.trim()).filter(Boolean);
function turnInfo(){ const n = nameList(); $('#turnInfo').textContent = n.length ? `${n.length - H.used.filter(u => n.includes(u)).length} of ${n.length} still to go` : 'Add your class list first ↓'; }
$('#helperBtn').onclick = () => { $('#namesIn').value = H.names; turnInfo(); if (!nameList().length) $('details').open = true; openModal('#helperModal'); };
$('#saveNames').onclick = () => { H.names = $('#namesIn').value; H.used = H.used.filter(u => nameList().includes(u)); save(); turnInfo(); toast('Class list saved'); };
$('#resetTurns').onclick = () => { H.used = []; save(); turnInfo(); $('#bigName').textContent = "Who's next?"; };
let rolling = false;
$('#pickBtn').onclick = () => {
  const all = nameList(); if (!all.length || rolling){ if (!all.length) $('details').open = true; return; }
  let left = all.filter(n => !H.used.includes(n));
  if (!left.length){ H.used = []; left = all.slice(); toast("Everyone's had a turn! Starting a new round."); }
  const pick = left[Math.floor(Math.random() * left.length)];
  rolling = true; let i = 0, delay = 50;
  const big = $('#bigName');
  (function spin(){
    big.textContent = all[i++ % all.length];
    delay *= 1.12;
    if (delay < 380) setTimeout(spin, delay);
    else { big.textContent = '⭐ ' + pick + ' ⭐'; try { big.animate([{transform:'scale(.6)'}, {transform:'scale(1.15)'}, {transform:'scale(1)'}], {duration:500}); } catch(e) {} H.used.push(pick); save(); turnInfo(); rolling = false; }
  })();
};

/* =====================================================
   GALLERY, KEEP, NEW, PICTURE
   ===================================================== */
$('#keepBtn').onclick = () => {
  if (!S.parts.length){ toast('Add some pieces first!'); return; }
  C.gallery.unshift({...JSON.parse(JSON.stringify(S)), date:new Date().toISOString().slice(0, 10)});
  if (C.gallery.length > 40) C.gallery.length = 40;
  save(); toast('📸 Saved to the gallery!');
};
function renderGallery(){
  const g = $('#galleryGrid');
  if (!C.gallery.length){ g.innerHTML = '<p class="hint">No snowmen saved yet. Build one and press 📸 Keep.</p>'; return; }
  g.innerHTML = C.gallery.map((s, i) => `<div class="g-card" data-i="${i}"><svg viewBox="0 0 1600 900">${fullSceneMarkup(s).replace(/id="([\w-]+)"/g, 'id="g' + i + '-$1"').replace(/url\(#([\w-]+)\)/g, 'url(#g' + i + '-$1)')}</svg><div class="cap"><span>${esc(s.name || 'Snowman')} <span class="hint">${s.date || ''}</span></span><button class="x" data-del="${i}" title="Delete">✕</button></div></div>`).join('');
  g.querySelectorAll('.g-card').forEach(c => c.onclick = e => {
    if (e.target.closest('[data-del]')){ if (confirm('Delete this snowman from the gallery?')){ C.gallery.splice(+e.target.closest('[data-del]').dataset.del, 1); save(); renderGallery(); } return; }
    snapshot(); const s = JSON.parse(JSON.stringify(C.gallery[+c.dataset.i])); delete s.date;
    resetStage(); C.snow = S = s; sel = -1; $('#nameIn').value = S.name || ''; save(); render();
    $('#galleryModal').classList.add('hidden'); toast('Welcome back, ' + (S.name || 'snowman') + '!');
  });
}
$('#galleryBtn').onclick = () => { renderGallery(); openModal('#galleryModal'); };
$('#newBtn').onclick = () => {
  if (S.parts.length && !confirm('Start a new snowman? (Press 📸 Keep first if you want to save this one.)')) return;
  snapshot();
  resetStage();
  S.parts = []; S.name = ''; C.snow = S;
  sel = -1; $('#nameIn').value = ''; save(); render();
  toast('Fresh snow! Tap a piece below to start.');
};
$('#pngBtn').onclick = () => {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">${fullSceneMarkup(S)}</svg>`;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement('canvas'); c.width = 1600; c.height = 900;
    c.getContext('2d').drawImage(img, 0, 0);
    const a = document.createElement('a'); a.download = `${(S.name || className).replace(/[^\w-]+/g, '-')}-snowman.png`; a.href = c.toDataURL('image/png'); a.click();
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
};

/* =====================================================
   MISC
   ===================================================== */
let toastTimer;
function toast(m){ const t = $('#toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.style.opacity = 0, 3200); }
$('#fsBtn').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.().catch(()=>{}); };
if (EMBED){ $('#hubBtn').classList.remove('hidden'); $('#fsBtn').classList.add('hidden'); $('#hubBtn').onclick = () => window.parent.postMessage({type:'twr-close'}, '*'); }

$('#defs').innerHTML = DEFS;
renderTabs(); render(); fitStage();
setTimeout(() => toast('Tap a piece below to add it · Drag pieces to move them'), 300);
</script>
